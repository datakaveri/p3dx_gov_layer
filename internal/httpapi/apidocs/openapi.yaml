  /api/v1/contracts:
    post:
      tags:
        - Contracts
      summary: Build FL Contract
      description: |
        Builds an FL session contract from a submission and its parties, and stores it as a new project
        (a new `project_id` every call). Called by the AAA layer:

        * when the owner sends the participation request (`finalize: false`, a draft), and
        * when the owner sends the final roster (`finalize: true`).

        On the final roster, the Governance Layer signs the contract hash and sends every data provider a
        `CONTRACT_SIGN` request. The FL session cannot start until they have all signed
        (see [Get Session Contract Signatures](#operation/get-session-contract-signatures)).
      operationId: post-contracts
      requestBody:
        description: |
          - `submission_id` : The FL submission (session) id
          - `output_owner_user_id` : The output owner's Keycloak user id
          - `parties` : The data providers, each with `id`, `username`, `dataset_name` and `data_url`
          - `finalize` : `true` for the final roster contract
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                submission_id:
                  type: string
                output_owner_user_id:
                  type: string
                parties:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      dataset_name:
                        type: string
                      data_url:
                        type: string
                finalize:
                  type: boolean
                  default: false
              required:
                - submission_id
            examples:
              Final Roster:
                value:
                  submission_id: sub-2026-10-14-001
                  output_owner_user_id: 0b6e3a7c-1f2d-4c5b-8a9e-3d4c5b6a7f8e
                  parties:
                    - id: provider-alice
                      username: alice
                      dataset_name: hospital-admissions-2025
                      data_url: https://data.example.com/admissions.csv
                  finalize: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  contract_id:
                    type: string
                  finalized:
                    type: boolean
                  contract:
                    $ref: '#/components/schemas/Contract'
                  sign_requests_sent:
                    type: integer
                    description: Number of data providers asked to sign (final roster only)
        '400':
          description: |-
            Bad Request
            - `MISSING_SELECTOR` : `submission_id` is missing
            - `INVALID_JSON` : the body is not valid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: MISSING_SELECTOR
                    message: submission_id is required
        '404':
          description: |-
            Not Found
            - Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: NOT_FOUND
                    message: Submission not found
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-codeSamples:
        - lang: cURL
          label: Build FL contract
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/contracts' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

