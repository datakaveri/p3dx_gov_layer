  /api/v1/generate-contract:
    post:
      tags:
        - Contracts
      summary: Generate Contract
      description: |
        Builds an unsigned contract from the consumer's dataset and technique selection, stores it as a draft
        and returns it. Regenerating the same selection replaces the same draft (with a new `contract_id`).

        For every selected dataset the APD policy is fetched (and, for FL, the provider form). A missing policy
        never fails the request. For TEE / SMPC without an APD policy, the dataset's DX catalogue owner is taken
        as its provider.

        What happens next depends on the contract:

        * **Datasets and infra (job approval)** : the contract is hashed and stored with its `contract_hash`, and
          each data and infra provider is sent a job request. `signing` is `on_hold_pending_approval`; see the
          [Job Approval](#tag/Job-Approval) endpoints.
        * **Other TEE / SMPC** : the Governance Layer signs the hash and sends each data provider a `CONTRACT_SIGN`
          request. `signing` is `requested`.
        * **FL** : nothing is sent yet; FL is signed on its final roster contract. `signing` is `not_applicable`.

        Errors from this endpoint are plain text, not JSON.
      operationId: post-generate-contract
      requestBody:
        description: |
          - `datasets` : The selected datasets, each with `dataset_id` and `dataset_name`
          - `technique` : `FL`, `TEE` or `SMPC`
          - `application_id` : Optional, the application to run
          - `provider_id` : Optional, overrides the provider named by the APD policy
          - `compute_choice` : Optional, defaulted per technique
          - `infra_ids` : The selected infrastructures; SMPC needs exactly 2, optional for TEE
          - `purpose` : The specific purpose of processing, shown to data providers in the DPDP Rule 3 consent
            notice and covered by the contract hash. Required for TEE; at most 1000 characters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                datasets:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      dataset_id:
                        type: string
                      dataset_name:
                        type: string
                technique:
                  type: string
                  enum:
                    - FL
                    - TEE
                    - SMPC
                application_id:
                  type: string
                provider_id:
                  type: string
                compute_choice:
                  type: string
                infra_ids:
                  type: array
                  items:
                    type: string
                purpose:
                  type: string
                  maxLength: 1000
              required:
                - datasets
                - technique
            examples:
              TEE with infra (job approval):
                value:
                  datasets:
                    - dataset_id: b34eb955-c691-4fd3-b200-f18bc78810a2
                      dataset_name: hospital-admissions-2025
                  technique: TEE
                  infra_ids:
                    - infra-azure-cvm-01
              SMPC:
                value:
                  datasets:
                    - dataset_id: b34eb955-c691-4fd3-b200-f18bc78810a2
                      dataset_name: hospital-admissions-2025
                  technique: SMPC
                  infra_ids:
                    - infra-node-a
                    - infra-node-b
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  contract:
                    $ref: '#/components/schemas/Contract'
                  sign_requests_sent:
                    type: integer
                  signing:
                    type: string
                    enum:
                      - not_applicable
                      - on_hold_pending_approval
                      - requested
                  approval_required:
                    type: boolean
                    description: '`true` when the contract names both datasets and infra'
                  providers_notified:
                    type: integer
                    description: Number of job requests sent (job approval only)
              examples:
                Job approval:
                  value:
                    status: success
                    contract:
                      job_id: job-7d1e3c9a
                      contract_id: 5c2b1e7a-3d4f-4a6b-9e8c-7d6f5e4a3b2c
                      technique: TEE
                      contract_hash: 9f2c4e6a8b0d1f3e5c7a9b1d3f5e7c9a1b3d5f7e9c1a3b5d7f9e1c3a5b7d9f1e
                    sign_requests_sent: 0
                    signing: on_hold_pending_approval
                    approval_required: true
                    providers_notified: 2
        '400':
          description: |-
            Bad Request (plain text)
            - `Invalid request body`
            - `at least one dataset is required`
            - `technique must be one of FL, TEE, SMPC`
            - `exactly 2 infra_ids are required for SMPC`
          content:
            text/plain:
              schema:
                type: string
              example: exactly 2 infra_ids are required for SMPC
        '401':
          description: |-
            Unauthorized (plain text)
            - `Invalid Keycloak token`, `Invalid token claims`
          content:
            text/plain:
              schema:
                type: string
              example: Invalid Keycloak token
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Generate contract
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/generate-contract' \
              --header 'Authorization: Bearer <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/contracts/{contractId}/sign:
    post:
      tags:
        - Contract Signing
      summary: Sign Contract
      description: |
        A data provider signs the contract's hash and sends the signature back.

        * The signer is the user in the provider's own token, never the body. If `provider_username` is sent it must match.
        * The Governance Layer re-hashes its own stored copy of the contract; the stored hash, the fresh hash and
          `contract_hash` must all agree.
        * The contract must carry a valid Governance Layer signature, and the caller must be one of its data providers.
        * The signature is verified with the public key registered at
          [Register Provider Public Key](#operation/put-provider-key).
        * A contract that needs job approval can only be signed once the job is approved.

        The reply is only `{"status": "signed", ...}` or `{"status": "not signed", "message": <reason>}`, with the HTTP status of the failure.
      operationId: post-contract-sign
      parameters:
        - $ref: '#/components/parameters/ContractIdParam'
      requestBody:
        description: |
          - `contract_hash` : The hash from the sign request
          - `signature` : The provider's base64 RSA signature (RSASSA-PKCS1-v1_5, SHA-256) over `contract_hash`
          - `provider_username` : Optional, must match the token's user
          - `notification_id` : Optional, the sign request to mark answered
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contract_hash:
                  type: string
                signature:
                  type: string
                provider_username:
                  type: string
                notification_id:
                  type: string
              required:
                - contract_hash
                - signature
            examples:
              Sign Contract:
                value:
                  contract_hash: 9f2c4e6a8b0d1f3e5c7a9b1d3f5e7c9a1b3d5f7e9c1a3b5d7f9e1c3a5b7d9f1e
                  signature: kX9v2Lq...Q==
                  notification_id: 9b2e7c1a-0d4f-4e3b-a6c5-1f2e3d4c5b6a
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
              examples:
                Example:
                  value:
                    status: signed
                    message: sent to governance layer
        '400':
          description: |-
            Bad Request
            - `contract_hash` or `signature` missing
            - The contract is a draft (only the final roster contract is signed)
            - The provider has no registered public key
            - The signature does not verify
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
              examples:
                Example:
                  value:
                    status: not signed
                    message: contract_hash and signature are required
        '401':
          description: |-
            Unauthorized
            - Token missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
              examples:
                Example:
                  value:
                    status: not signed
                    message: MISSING_AUTH_TOKEN
        '403':
          description: |-
            Forbidden
            - `provider_username` does not match the token's user
            - The caller is not a data provider on this contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
              examples:
                Example:
                  value:
                    status: not signed
                    message: NOT_A_PARTY
        '404':
          description: |-
            Not Found
            - No such contract (it may have been regenerated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
              examples:
                Example:
                  value:
                    status: not signed
                    message: contract not found — it may have been regenerated
        '409':
          description: |-
            Conflict
            - The job is not approved yet
            - The signed hash does not match the Governance Layer's copy of the contract
            - The contract has no valid Governance Layer signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
              examples:
                Example:
                  value:
                    status: not signed
                    message: signed hash does not match the governance layer's copy of the contract
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
        '502':
          description: |-
            Bad Gateway
            - The provider's public key could not be looked up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Sign contract
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/contracts/<contractId>/sign' \
              --header 'Authorization: Bearer <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/contracts/{contractId}/consent-expiry:
    post:
      tags:
        - Contract Signing
      summary: Set Consent Expiry
      description: |
        A data provider sets when their consent on a TEE/SMPC consent request ends, before signing it.

        * The provider is the user in their own token, and must be a data provider on the contract who has not
          signed it yet (withdraw consent first to change it after signing).
        * `valid_until` must be in the future and no later than the contract's `lifecycle.valid_until`. A date
          (`YYYY-MM-DD`) means the end of that day, UTC.
        * It is stored as `data_providers[].constraints.consent_valid_until`, which is covered by the contract
          hash: the contract is re-hashed and re-signed by the governance layer, any signatures already given are
          cleared, the old sign requests are marked `superseded`, and every data provider is sent a new one.
        * The consumer gets a `CONSENT_EXPIRY_SET` notification and a `consent_expiry_set` contract event.
        * Once any provider's consent has expired, the run gate refuses the contract with `CONSENT_EXPIRED`.
        * Not available on contracts that go through job approval.
      operationId: post-contract-consent-expiry
      parameters:
        - $ref: '#/components/parameters/ContractIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - valid_until
              properties:
                valid_until:
                  type: string
            examples:
              Set Consent Expiry:
                value:
                  valid_until: '2026-11-30'
      responses:
        '200':
          description: OK — the updated contract, its new hash, and how many sign requests were re-sent.
        '400':
          description: Bad or out-of-range `valid_until`, or not a TEE/SMPC contract.
        '403':
          description: The caller is not a data provider on this contract.
        '404':
          description: Contract not found.
        '409':
          description: Already signed, or the contract goes through job approval.

  /api/v1/contracts/{contractId}/withdraw-consent:
    post:
      tags:
        - Contract Signing
      summary: Withdraw Consent
      description: |
        A data provider withdraws the consent they gave by signing a TEE contract (DPDP Act 2023 s.6(4),
        DPDP Rules 2025 Rule 3(c)(i)).

        * The provider is the user in their own token.
        * Their signature on every party of theirs is cleared and `withdrawn_at` recorded. The contract hash does
          not change, so they can sign it again later to give consent again.
        * Any further TEE run on the contract is refused by the run gate with `consent withdrawn`. A run already
          in progress is not stopped.
        * TEE contracts only.
      operationId: post-contract-withdraw-consent
      parameters:
        - $ref: '#/components/parameters/ContractIdParam'
      requestBody:
        description: |
          - `notification_id` : Optional, the sign request to mark `withdrawn`
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_id:
                  type: string
            examples:
              Withdraw Consent:
                value:
                  notification_id: 9b2e7c1a-0d4f-4e3b-a6c5-1f2e3d4c5b6a
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Example:
                  value:
                    status: withdrawn
                    message: consent withdrawn
                    withdrawn_at: '2026-10-15T10:00:00Z'
        '400':
          description: |-
            Bad Request
            - The contract is not a TEE contract
        '401':
          description: |-
            Unauthorized
            - Token missing, invalid or expired
        '403':
          description: |-
            Forbidden
            - The caller is not a data provider on this contract
        '404':
          description: |-
            Not Found
            - No such contract
        '409':
          description: |-
            Conflict
            - The caller has not signed this contract, so there is nothing to withdraw
        '500':
          description: Internal Server Error
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Withdraw consent
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/contracts/<contractId>/withdraw-consent' \
              --header 'Authorization: Bearer <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/contracts/{contractId}/signatures:
    get:
      tags:
        - Contract Signing
      summary: Get Contract Signatures
      description: |
        Re-verifies every signature on a contract and reports whether the run can start.
        `matching` / `can run` only when the contract is a final (signable) contract and every signature verifies.
      operationId: get-contract-signatures
      parameters:
        - $ref: '#/components/parameters/ContractIdParam'
      responses:
        '200':
          $ref: '#/components/responses/SignatureStatus'
        '404':
          $ref: '#/components/responses/ContractNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-codeSamples:
        - lang: cURL
          label: Get contract signatures
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/contracts/<contractId>/signatures'

  /api/v1/contracts/{contractId}:
    get:
      tags:
        - Contract Signing
      summary: Get Contract
      description: |
        The stored contract, for the consumer who generated it (their Keycloak token's `sub` must be
        `parties.user.id`). Used by the consent request preview to pick up later changes, such as a data
        provider's consent expiry.
      operationId: get-contract
      parameters:
        - $ref: '#/components/parameters/ContractIdParam'
      responses:
        '200':
          description: '`{"status": "SUCCESS", "contract": {...}}`'
        '401':
          description: Invalid Keycloak token.
        '403':
          description: Not the consumer who generated this contract.
        '404':
          description: Contract not found.
    put:
      tags:
        - Contract Signing
      summary: Edit Contract
      description: |
        Lets the consumer who generated a TEE contract edit it in place (same contract_id). Every field is optional; omitted fields are unchanged.
        Only lifecycle valid_from/valid_until, the consumer's name, each data provider's dataset name/version, data URL and key resource path,
        and the workload image/CPU/memory can be changed — never the contract id, hash, signatures, technique or party identities.
        The contract is not rehashed or re-signed, so it no longer matches the hash its data providers signed,
        and `POST /v1/tee/run` then refuses it with `CONTRACT_NOT_SIGNED`.
      operationId: edit-contract
      parameters:
        - $ref: '#/components/parameters/ContractIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lifecycle:
                  type: object
                  properties:
                    valid_from:
                      type: string
                      format: date-time
                    valid_until:
                      type: string
                      format: date-time
                user:
                  type: object
                  properties:
                    name:
                      type: string
                data_providers:
                  type: array
                  description: Positional — entry i edits parties.data_providers[i].
                  items:
                    type: object
                    properties:
                      dataset_name:
                        type: string
                      dataset_version:
                        type: string
                      data_url:
                        type: string
                      key_resource_path:
                        type: string
                workload:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Switch to another workload from GET /workloads.
                    image:
                      type: string
                    cpu:
                      type: string
                    memory:
                      type: string
      responses:
        '200':
          description: Contract updated; `changes` lists each edit and `hash_matches` is false once the content differs from the signed hash.
        '400':
          description: Nothing changed, invalid value, or not a TEE contract.
        '401':
          description: Missing or invalid Keycloak token.
        '403':
          description: Caller is not the consumer who generated the contract.
        '404':
          $ref: '#/components/responses/ContractNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: cURL
          label: Edit contract
          source: |
            curl --location --request PUT 'https://v2.dev.iudx.io/gov-layer/api/v1/contracts/<contractId>' \
            --header 'Authorization: Bearer <consumer token>' \
            --header 'Content-Type: application/json' \
            --data '{"workload": {"cpu": "2"}, "lifecycle": {"valid_until": "2027-06-30T00:00:00Z"}}'

  /api/v1/workloads:
