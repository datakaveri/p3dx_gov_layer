                        checked_at: '2026-10-14T10:25:00Z'
                    signature:
                      submitted: true
                      contract_hash: 9f2c4e6a8b0d1f3e5c7a9b1d3f5e7c9a1b3d5f7e9c1a3b5d7f9e1c3a5b7d9f1e
                      items_signed: 1
                      verified_at: GET /job/job-7d1e3c9a/status
        '400':
