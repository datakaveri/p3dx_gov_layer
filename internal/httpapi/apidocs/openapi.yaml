            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/vm-registry' \
              --header 'X-VM-Registry-Token: <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/vm-registry/output-owner:
    get:
      tags:
        - VM Registry
      summary: Get Output Owner VM
      description: |
        Returns the most recently registered output-owner VM. A data provider's VM provisioning uses it to find the
        FL broker host.
      operationId: get-vm-registry-output-owner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  vm:
                    $ref: '#/components/schemas/VMRegistryEntry'
              examples:
                Example:
                  value:
                    status: SUCCESS
                    vm:
                      role: user
                      participant_name: bob
                      ip_address: 10.0.4.10
                      updated_at: '2026-10-14T09:00:00Z'
        '401':
          $ref: '#/components/responses/VMRegistryUnauthorized'
        '404':
          description: |-
            Not Found
            - No output-owner VM registered yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: NOT_FOUND
                    message: no output-owner VM registered yet
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - vmRegistryToken: []
      x-codeSamples:
        - lang: cURL
          label: Get output owner VM
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/vm-registry/output-owner' \
              --header 'X-VM-Registry-Token: <tokenValue>'

  /api/v1/vm-registry/data-providers:
    get:
      tags:
        - VM Registry
      summary: List Data Provider VMs
      description: |
        Returns every registered data-provider VM.
      operationId: get-vm-registry-data-providers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  vms:
                    type: array
                    items:
                      $ref: '#/components/schemas/VMRegistryEntry'
              examples:
                Example:
                  value:
                    status: SUCCESS
                    vms:
                      - role: data-provider
                        participant_name: alice
                        ip_address: 10.0.4.17
                        updated_at: '2026-10-14T09:05:00Z'
        '401':
          $ref: '#/components/responses/VMRegistryUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - vmRegistryToken: []
      x-codeSamples:
        - lang: cURL
          label: List data provider VMs
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/vm-registry/data-providers' \
              --header 'X-VM-Registry-Token: <tokenValue>'

components:
  securitySchemes:
    authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak issued Bearer token
    vmRegistryToken:
      type: apiKey
      in: header
      name: X-VM-Registry-Token
      description: Shared secret; only checked when the deployment sets `VM_REGISTRY_TOKEN`
  parameters:
    FLSubmissionParam:
      name: submissionId
      in: path
      required: true
      description: The raw FL submission id (the contract's session_id)
      schema:
        type: string
    RoleParam:
      name: role
      in: path
      required: true
      description: The provider role the caller holds
      schema:
        type: string
        enum:
          - data-provider
          - infra-provider
    NotificationIdParam:
      name: key
      in: path
      required: true
      description: The notification's id
      schema:
        type: string
    SessionIdParam:
      name: sessionId
      in: path
      required: true
      description: The FL session (submission) id
      schema:
        type: string
    ContractIdParam:
      name: contractId
      in: path
      required: true
      description: The contract's id
      schema:
        type: string
    JobIdParam:
      name: jobId
      in: path
      required: true
      description: The job's id (from Generate Contract)
      schema:
        type: string
    ModelSessionParam:
      name: session_id
      in: query
      required: false
      description: The FL session; defaults to the newest session
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_-]+$
    ModelRoundParam:
      name: round
      in: query
      required: false
      description: The round; defaults to the session's final round
      schema:
        type: integer
        minimum: 0
  requestBodies:
    ApprovalBody:
      description: |
        - `job_id` : The job to approve
        - `contract_hash` : The hash from the job request
        - `signature` : The provider's base64 RSA signature (RSASSA-PKCS1-v1_5, SHA-256) over `contract_hash`
        - `provider_comment`, `feedback_to_consumer` : Optional, data provider only; copied into their IUDX policies
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              job_id:
                type: string
              contract_hash:
                type: string
              signature:
                type: string
              provider_comment:
                type: string
              feedback_to_consumer:
                type: string
            required:
              - job_id
              - contract_hash
              - signature
          examples:
            Approve Job:
              value:
                job_id: job-7d1e3c9a
                contract_hash: 9f2c4e6a8b0d1f3e5c7a9b1d3f5e7c9a1b3d5f7e9c1a3b5d7f9e1c3a5b7d9f1e
                signature: kX9v2Lq...Q==
  responses:
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: INTERNAL_ERROR
    InvalidJSON:
      description: |-
        Bad Request
        - `INVALID_JSON` : the body is not valid JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: INVALID_JSON
                message: Invalid JSON in request body
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: NOT_FOUND
    ContractNotFound:
      description: |-
        Not Found
        - No such contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: CONTRACT_NOT_FOUND
    JobNotFound:
      description: |-
        Not Found
        - No contract for this `job_id`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: NOT_FOUND
                message: No contract for this job_id
    ProviderTokenUnauthorized:
      description: |-
        Unauthorized
        - `MISSING_AUTH_TOKEN` : no Bearer token
        - `INVALID_OR_EXPIRED_TOKEN` : the token is invalid or expired
        - `INVALID_TOKEN_CLAIMS` : the token has no username or `sub`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: INVALID_OR_EXPIRED_TOKEN
    DevTokenUnauthorized:
      description: |-
        Unauthorized
        - `MISSING_AUTH_TOKEN` : no Bearer token
        - `INVALID_OR_EXPIRED_TOKEN` : the token is not a valid DX Keycloak token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: MISSING_AUTH_TOKEN
                message: send the consumer's dev Keycloak token as the Bearer token
    VMRegistryUnauthorized:
      description: |-
        Unauthorized
        - `UNAUTHORIZED` : `X-VM-Registry-Token` is missing or wrong
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: UNAUTHORIZED
                message: invalid or missing X-VM-Registry-Token
    ContractResult:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: SUCCESS
              contract:
                $ref: '#/components/schemas/Contract'
    SignatureStatus:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              signatures:
                type: string
                enum:
                  - matching
                  - not matching
              tee:
                type: string
                enum:
                  - can run
                  - cannot run
          examples:
            All signed:
              value:
                signatures: matching
                tee: can run
            Not all signed:
              value:
                signatures: not matching
                tee: cannot run
    ModelBadRequest:
      description: |-
        Bad Request
        - `INVALID_SESSION_ID` : `session_id` has characters other than letters, digits, `-` and `_`
        - `INVALID_ROUND` : `round` is not a non-negative integer
        - `INVALID_PATH`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: INVALID_ROUND
    NoModel:
      description: |-
        Not Found
        - `NO_MODEL` : no checkpoints yet, or none for that session / round
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: NO_MODEL
                message: No model for that session.
  schemas:
    Failed:
      type: object
      properties:
        status:
          type: string
          example: FAILED
        error:
          type: string
          description: Error code
        message:
          type: string
        detail:
          type: string
    DataProvider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
    Notification:
      type: object
      properties:
        id:
          type: string
        recipient_id:
          type: string
        recipient_username:
          type: string
        sender_username:
          type: string
        message:
          type: string
        payload:
          type: object
          additionalProperties: true
        read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        response:
          type: string
          nullable: true
          enum:
            - accepted
            - declined
            - null
          description: '`null` until the recipient answers'
        response_message:
          type: string
          nullable: true
        responded_at:
          type: string
          format: date-time
          nullable: true
    CreatedNotification:
      type: object
      properties:
        id:
          type: string
        recipientId:
          type: string
        recipientUsername:
          type: string
        senderUsername:
          type: string
        message:
          type: string
        payload:
          type: object
          additionalProperties: true
        read:
          type: boolean
        created_at:
          type: string
    NotificationList:
      type: object
      properties:
        status:
          type: string
          example: SUCCESS
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    NotificationResult:
      type: object
      properties:
        status:
          type: string
          example: SUCCESS
        notification:
          $ref: '#/components/schemas/Notification'
    Project:
      type: object
      properties:
        project_id:
          type: string
        session_id:
          type: string
        data_provider_usernames:
          type: array
          items:
            type: string
    Signature:
      type: object
      properties:
        signed_at:
          type: string
          format: date-time
          nullable: true
        signer:
          type: string
          description: Username whose public key verifies `value`
        algorithm:
          type: string
          example: RSASSA-PKCS1-v1_5-SHA256
        signed_hash:
          type: string
          description: The contract hash that was signed
        value:
          type: string
          description: base64 signature
    Constraints:
      type: object
      properties:
        accessibility_level:
          type: string
        restricted_to:
          type: array
          items:
            type: string
    Contract:
      type: object
      description: The contract shared by FL, TEE and SMPC.
      properties:
        project_id:
          type: string
        contract_id:
          type: string
        job_id:
          type: string
        version:
          type: integer
        lifecycle:
          type: object
          properties:
            created_at:
              type: string
              format: date-time
            valid_from:
              type: string
              format: date-time
            valid_until:
              type: string
              format: date-time
        technique:
          type: string
          enum:
            - FL
            - TEE
            - SMPC
        compute_choice:
          type: string
        parties:
          type: object
          properties:
            user:
              type: object
              description: The consumer
              properties:
                id:
                  type: string
                name:
                  type: string
                datablob_url:
                  type: string
                signature:
                  $ref: '#/components/schemas/Signature'
            data_providers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  dataset_id:
                    type: string
                  dataset_name:
                    type: string
                  dataset_version:
                    type: string
                  data_url:
                    type: string
                  constraints:
                    $ref: '#/components/schemas/Constraints'
                  trustee:
                    type: object
                    properties:
                      kbs_url:
                        type: string
                      key_resource_path:
                        type: string
                  signature:
                    $ref: '#/components/schemas/Signature'
            data_provider_count:
              type: integer
            application_providers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  app_name:
                    type: string
                  container_image:
                    type: string
                  container_digest:
                    type: string
                  constraints:
                    $ref: '#/components/schemas/Constraints'
                  signature:
                    $ref: '#/components/schemas/Signature'
            infra_providers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  region:
                    type: string
                  attestation:
                    type: object
                    properties:
                      required:
                        type: boolean
                      service:
                        type: string
                      policy_id:
                        type: string
                  resource_allocation:
                    type: object
                    properties:
                      cpu_cores:
                        type: integer
                      ram_mb:
                        type: integer
                      gpu:
                        type: string
                      sgx_enabled:
                        type: boolean
                      tdx_enabled:
                        type: boolean
                      sev_snp_enabled:
                        type: boolean
                      sev_enabled:
                        type: boolean
                      nitro_enclave_enabled:
                        type: boolean
                  constraints:
                    $ref: '#/components/schemas/Constraints'
                  signature:
                    $ref: '#/components/schemas/Signature'
            infra_provider_count:
              type: integer
        session_info:
          type: object
          properties:
            id:
              type: string
            session_id:
              type: string
            requested_by:
              type: string
        contract_hash:
          type: string
        governance_signature:
          $ref: '#/components/schemas/Signature'
    SignResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - signed
            - not signed
        message:
          type: string
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        job_id:
          type: string
        type:
          type: string
          enum:
            - data-provider
            - infra-provider
        provider_id:
          type: string
        item:
          type: string
          description: The dataset or infra id
        status:
          type: string
          enum:
            - accepted
            - rejected
        has_role:
          type: boolean
        in_catalogue:
          type: boolean
        reason:
          type: string
        checked_at:
          type: string
          format: date-time
    ApprovalResult:
      type: object
      properties:
        status:
          type: string
          example: SUCCESS
        job_id:
          type: string
        type:
          type: string
          enum:
            - data-provider
            - infra-provider
        approval:
          type: string
          enum:
            - accepted
            - rejected
            - pending
          description: The caller's own result
        data_provider:
          type: string
          enum:
            - accepted
            - rejected
            - pending
        infra_provider:
          type: string
          enum:
            - accepted
            - rejected
            - pending
        job_approval:
          type: string
          description: The whole job's result
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        signature:
          type: object
          properties:
            submitted:
              type: boolean
            contract_hash:
              type: string
            items_signed:
              type: integer
            verified_at:
              type: string
            verified:
              type: boolean
              description: Data provider only; the signature was verified before recording
    GrantResult:
      type: object
      properties:
        item_type:
          type: string
          enum:
            - dataset
            - infra
        item_id:
          type: string
        policy_id:
          type: string
        status:
          type: string
          enum:
            - posted
            - failed
        error:
          type: string
    IudxPolicyResult:
      type: object
      properties:
        item_id:
          type: string
        policy_id:
          type: string
        status:
          type: string
          enum:
            - posted
            - failed
        error:
          type: string
    PartySignatureStatus:
      type: object
      properties:
        role:
          type: string
          enum:
            - data-provider
            - infra-provider
        provider_id:
          type: string
        dataset_name:
          type: string
        infra_id:
          type: string
        signed:
          type: boolean
        valid:
          type: boolean
        signer:
          type: string
        signed_at:
          type: string
          format: date-time
        error:
          type: string
    FinalContract:
      type: object
      nullable: true
      properties:
        job_id:
          type: string
        contract_id:
          type: string
        contract_hash:
          type: string
        contract:
          $ref: '#/components/schemas/Contract'
        created_at:
          type: string
          format: date-time
    UserJob:
      type: object
      properties:
        job_id:
          type: string
        contract_id:
          type: string
        technique:
          type: string
        job_state:
          type: string
          enum:
            - in_progress
            - final
            - tee_enabled
        created_at:
          type: string
          format: date-time
        finalized_at:
          type: string
          format: date-time
          nullable: true
        tee_enabled_at:
          type: string
          format: date-time
          nullable: true
        participation:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - consumer
                  - data-provider
                  - infra-provider
              participant_id:
                type: string
              user_id:
                type: string
              username:
                type: string
              item_id:
                type: string
              item_name:
                type: string
              status:
                type: string
                enum:
                  - created
                  - requested
                  - approved
                  - rejected
                  - signed
                  - final
                  - tee_enabled
              updated_at:
                type: string
                format: date-time
        datasets:
          type: array
          description: The datasets on the job's contract. Only returned by `GET /jobs/consumer/{userId}` and `GET /jobs/provider/{userId}`.
          items:
            type: object
            properties:
              dataset_id:
                type: string
                description: Catalogue id of the dataset (empty if the contract has none)
              dataset_name:
                type: string
              provider_id:
                type: string
    FinalModel:
      type: object
      properties:
        session_id:
          type: string
        round:
          type: integer
        file:
          type: string
        size_bytes:
          type: integer
        modified_at:
          type: string
          format: date-time
    VMRegistryEntry:
      type: object
      properties:
        role:
          type: string
          enum:
            - data-provider
            - user
        participant_name:
          type: string
        ip_address:
          type: string
        updated_at:
          type: string
