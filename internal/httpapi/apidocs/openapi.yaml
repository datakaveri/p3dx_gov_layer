openapi: 3.0.2
info:
  title: DX Governance Layer Server
  version: 1.0.0
  description: |-

    # About DX Governance Layer

      **Governance Layer** (`p3dx_gov_layer`) is the trust and policy layer of the P3DX platform.
    It builds the contract behind every privacy-preserving computation (Federated Learning, TEE and SMPC),
    gets that contract approved and signed by every data and infra provider, checks it against the
    providers' policies in APD, and only then lets the computation run.

    It also keeps the participation notifications, projects, final FL models and participant-VM registry
    that the FL flow uses.

    # Configurations
    - **Server**:
      - In the doc, we display the server url to be https://v2.dev.iudx.io/gov-layer with the hostname as v2.dev.iudx.io/gov-layer
      - This could be configured according to the deployment
    - **Base path**:
      - Base path is the path on which API is served, relative to the host
      - All the APIs in this document contain `/api/v1` as their base path
      - Every API is also served, unchanged, under the `/governance` base path (e.g. `/governance/contracts`)
    - **Request Samples**:
      - The `<tokenValue>` in the header of request sample could be replaced with respective token value [Also refer Tokens section [here](#section/Tokens)]
      - The `<payload>` in the request sample could be replaced with the payload given adjacent to the request sample

    # Tokens
     - Endpoints that need a token take it as `Authorization: Bearer <tokenValue>`, except `POST /contract`, which takes it in the request body
     - Endpoints not listed here need no token

    | Endpoint | Token Type | Users |
    |----------|------------|--------|
    | [(PUT) /provider-keys/{role}](#operation/put-provider-key) | P3DX Keycloak Token or DX Keycloak Token | Data Provider, Infra Provider |
    | [(GET) /provider-keys/{role}/status](#operation/get-provider-key-status) | P3DX Keycloak Token or DX Keycloak Token | Data Provider, Infra Provider |
    | [(POST) /contract](#operation/post-contract) | Keycloak Token (in body) | Consumer |
    | [(POST) /generate-contract](#operation/post-generate-contract) | Keycloak Token | Consumer |
    | [(POST) /contracts/{contractId}/sign](#operation/post-contract-sign) | P3DX Keycloak Token or DX Keycloak Token | Data Provider |
    | [(POST) /job/approval/data-provider](#operation/post-job-approval-data-provider) | DX Keycloak Token | Data Provider |
    | [(POST) /job/approval/infra-provider](#operation/post-job-approval-infra-provider) | DX Keycloak Token | Infra Provider |
    | [(GET) /job/{jobId}/status](#operation/get-job-status) | DX Keycloak Token | Consumer (the job's) |
    | [(POST) /job/{jobId}/tee](#operation/post-job-tee) | DX Keycloak Token | Consumer (the job's) |
    | [(GET) /job/{jobId}/contract/{contractId}](#operation/get-job-contract) | DX Keycloak Token | Consumer, Data Provider, Infra Provider (the job's) |
    | [(GET) /jobs/user/{userId}](#operation/get-user-jobs) | DX Keycloak Token | Any user |
    | [(GET) /jobs/consumer/{userId}](#operation/get-consumer-jobs) | DX Keycloak Token | Consumer |
    | [(GET) /jobs/provider/{userId}](#operation/get-provider-jobs) | DX Keycloak Token | Data Provider |
    | [(POST) /vm-registry](#operation/post-vm-registry) | `X-VM-Registry-Token` header | Provisioning scripts |
    | [(GET) /vm-registry/output-owner](#operation/get-vm-registry-output-owner) | `X-VM-Registry-Token` header | Provisioning scripts |
    | [(GET) /vm-registry/data-providers](#operation/get-vm-registry-data-providers) | `X-VM-Registry-Token` header | Provisioning scripts |

    The `X-VM-Registry-Token` header is only checked when the deployment sets `VM_REGISTRY_TOKEN`.

    # Job flow (TEE / SMPC with datasets and infra)
    1. Each provider registers their public key: `PUT /provider-keys/{role}`, and can check it is registered: `GET /provider-keys/{role}/status`
    2. The consumer generates the contract: `POST /generate-contract` (returns `job_id`, `contract_id` and `contract_hash`)
    3. Each data provider lists the jobs requested from them: `GET /jobs/provider/{userId}` (an infra provider uses `GET /jobs/user/{userId}`, where their `participation` entry has `status` = `requested`), and gets the contract and its `contract_hash`: `GET /job/{jobId}/contract/{contractId}`
    4. Each data provider and infra provider approves the job and signs the `contract_hash`: `POST /job/approval/data-provider`, `POST /job/approval/infra-provider`
    5. The consumer can check which providers have signed: `GET /contracts/{contractId}/signatures`
    6. The consumer cross-verifies the approvals and signatures, which makes the contract final: `GET /job/{jobId}/status`
    7. The consumer enables the TEE run: `POST /job/{jobId}/tee`

    The consumer can list the jobs they created and see each one's status at any point: `GET /jobs/consumer/{userId}`.

    # API HTTP Responses
     Apart from the response codes specified in each API, the API server may respond with certain 4xx and 5xx error codes which are related to common API Gateway behaviours.
     The application should address them accordingly.

  contact:
    name: For support contact CDPG Team at
    email: support@datakaveri.org
    url: https://dataforpublicgood.org.in/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://v2.dev.iudx.io/gov-layer
    description: dynamic server url
tags:
  - name: Data Providers
    description: The provider directory used by the FL flow.
  - name: Provider Keys
    description: Each provider's contract-signing RSA public key.
  - name: Notifications
    description: FL participation requests and the providers' responses.
  - name: Contracts
    description: Building, storing and submitting contracts for FL, TEE and SMPC.
  - name: Contract Signing
    description: Data-provider signatures over a contract's hash.
  - name: Projects
    description: The project recorded against each FL session.
  - name: Job Approval
    description: Data and infra providers approving a job, and the consumer cross-verifying it.
  - name: Jobs
    description: A job's contract, and every job a user takes part in.
  - name: Final Models
    description: The global models produced by FL sessions.
  - name: Flotilla Gateway
    description: TLS certificates for FL session gateways, signed by the governance CA.
  - name: VM Registry
    description: IP addresses of the participant VMs created for an FL session.
paths:
  /api/v1/data-providers:
    get:
      tags:
        - Data Providers
      summary: List Data Providers
      description: |
        Returns the data providers known to the Governance Layer, with their id, name and email.
      operationId: get-data-providers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  data_providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataProvider'
              examples:
                Example:
                  value:
                    status: SUCCESS
                    data_providers:
                      - id: provider-alice
                        name: Alice
                        email: alice@example.com
      security: []
      x-codeSamples:
        - lang: cURL
          label: List data providers
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/data-providers'

  /api/v1/provider-keys/{role}:
    put:
      tags:
        - Provider Keys
      summary: Register Provider Public Key
      description: |
        Registers (or replaces) the caller's contract-signing public key. Contract and job-approval
        signatures from this provider are verified against it.

        * The key is stored under the username in the caller's token, never one from the body.
        * The caller must hold the `{role}` realm role. A dev Keycloak token's `provider` role also counts as `data-provider`.
        * The key must be an RSA public key of at least 2048 bits, in SPKI PEM form (`-----BEGIN PUBLIC KEY-----`).
        * The key is per user: one key serves both provider roles.
        * `rotated` is `true` when an existing key was replaced.
      operationId: put-provider-key
      parameters:
        - $ref: '#/components/parameters/RoleParam'
      requestBody:
        description: |
          - `public_key_pem` : The provider's RSA public key in SPKI PEM form
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public_key_pem:
                  type: string
              required:
                - public_key_pem
            examples:
              Register Public Key:
                value:
                  public_key_pem: "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...\n-----END PUBLIC KEY-----\n"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  fingerprint_sha256:
                    type: string
                    description: SHA-256 of the key's DER bytes, hex-encoded
                  rotated:
                    type: boolean
              examples:
                Example:
                  value:
                    status: SUCCESS
                    fingerprint_sha256: 3f1c9a0e5b7d2c4a8e6f1b3d5c7a9e0f2b4d6c8a0e2f4b6d8c0a2e4f6b8d0c2a
                    rotated: false
        '400':
          description: |-
            Bad Request
            - `ROLE_NOT_ALLOWED` : `{role}` is not `data-provider` or `infra-provider`
            - `MISSING_PUBLIC_KEY`, `PRIVATE_KEY_NOT_ACCEPTED`, `EXPECTED_SPKI_PEM`, `INVALID_PUBLIC_KEY`, `EXPECTED_RSA_KEY`, `KEY_TOO_SHORT` : the key is not acceptable
            - `INVALID_JSON` : the body is not valid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: KEY_TOO_SHORT
        '401':
          $ref: '#/components/responses/ProviderTokenUnauthorized'
        '403':
          description: |-
            Forbidden
            - `INSUFFICIENT_ROLE` : the token does not hold the `{role}` realm role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: INSUFFICIENT_ROLE
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Register public key
          source: |
            curl --location --request PUT 'https://v2.dev.iudx.io/gov-layer/api/v1/provider-keys/data-provider' \
              --header 'Authorization: Bearer <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/provider-keys/{role}/status:
    get:
      tags:
        - Provider Keys
      summary: Get Provider Public Key Status
      description: |
        Shows whether the caller already has a public key registered. `{role}` only checks that the
        caller holds that role; the key itself is per user.
      operationId: get-provider-key-status
      parameters:
        - $ref: '#/components/parameters/RoleParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  exists:
                    type: boolean
              examples:
                Key registered:
                  value:
                    status: SUCCESS
                    exists: true
                No key yet:
                  value:
                    status: SUCCESS
                    exists: false
        '400':
          description: |-
            Bad Request
            - `ROLE_NOT_ALLOWED` : `{role}` is not `data-provider` or `infra-provider`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: ROLE_NOT_ALLOWED
        '401':
          $ref: '#/components/responses/ProviderTokenUnauthorized'
        '403':
          description: |-
            Forbidden
            - `INSUFFICIENT_ROLE` : the token does not hold the `{role}` realm role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: INSUFFICIENT_ROLE
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Get public key status
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/provider-keys/data-provider/status' \
              --header 'Authorization: Bearer <tokenValue>'

  /api/v1/send-provider-message:
    post:
      tags:
        - Notifications
      summary: Send Provider Message
      description: |
        Stores a message for a data provider, e.g. from an FL output owner.
      operationId: post-send-provider-message
      requestBody:
        description: |
          - `provider_id` : The provider's id
          - `provider_email` : The provider's email
          - `provider_name` : The provider's name
          - `output_owner_id` : The sender's id
          - `message` : The message text
          - `timestamp` : Optional, ISO8601
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider_id:
                  type: string
                provider_email:
                  type: string
                  format: email
                provider_name:
                  type: string
                output_owner_id:
                  type: string
                message:
                  type: string
                timestamp:
                  type: string
                  nullable: true
              required:
                - provider_id
                - provider_email
            examples:
              Send Message:
                value:
                  provider_id: provider-alice
                  provider_email: alice@example.com
                  provider_name: Alice
                  output_owner_id: bob
                  message: Your dataset has been selected for an FL session.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  message_id:
                    type: string
                  data:
                    type: object
                    properties:
                      provider_id:
                        type: string
                      provider_name:
                        type: string
                      provider_email:
                        type: string
                      message:
                        type: string
              examples:
                Example:
                  value:
                    status: success
                    message: Message sent to provider
                    message_id: 6f1d2c3b-4a5e-4f60-8a7b-9c0d1e2f3a4b
                    data:
                      provider_id: provider-alice
                      provider_name: Alice
                      provider_email: alice@example.com
                      message: Your dataset has been selected for an FL session.
        '400':
          description: |-
            Bad Request
            - `MISSING_PROVIDER_INFO` : `provider_id` or `provider_email` is missing
            - `INVALID_JSON` : the body is not valid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: MISSING_PROVIDER_INFO
                    message: provider_id and provider_email are required
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-codeSamples:
        - lang: cURL
          label: Send provider message
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/send-provider-message' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/notifications:
    post:
      tags:
        - Notifications
      summary: Create Participation Requests
      description: |
        Creates one notification per recipient, e.g. an FL output owner asking each selected provider
        whether they will still take part. The `payload` is stored as-is; for FL it carries the
        `submission_id`, which is what a provider's acceptance later signs (see
        [Respond to Notification](#operation/post-notification-respond)).
      operationId: post-notifications
      requestBody:
        description: |
          - `recipients` : The providers to notify, each with `id` and `username`
          - `senderUsername` : The sender's username
          - `message` : The message text
          - `payload` : Any JSON, stored with every notification
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipients:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                senderUsername:
                  type: string
                message:
                  type: string
                payload:
                  type: object
                  additionalProperties: true
              required:
                - recipients
            examples:
              Create Participation Requests:
                value:
                  recipients:
                    - id: provider-alice
                      username: alice
                    - id: provider-carol
                      username: carol
                  senderUsername: bob
                  message: Are you still willing to join this FL session?
                  payload:
                    submission_id: sub-2026-10-14-001
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  created:
                    type: integer
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreatedNotification'
              examples:
                Example:
                  value:
                    status: SUCCESS
                    created: 1
                    notifications:
                      - id: 9b2e7c1a-0d4f-4e3b-a6c5-1f2e3d4c5b6a
                        recipientId: provider-alice
                        recipientUsername: alice
                        senderUsername: bob
                        message: Are you still willing to join this FL session?
                        payload:
                          submission_id: sub-2026-10-14-001
                        read: false
                        created_at: '2026-10-14T10:15:00.000Z'
        '400':
          description: |-
            Bad Request
            - `MISSING_RECIPIENTS` : `recipients` is empty
            - `INVALID_JSON` : the body is not valid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: MISSING_RECIPIENTS
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-codeSamples:
        - lang: cURL
          label: Create participation requests
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/notifications' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/notifications/{key}:
    get:
      tags:
        - Notifications
      summary: Get Notifications for a User
      description: |
        Returns every notification sent to one user, including contract sign requests
        (`payload.type` = `CONTRACT_SIGN`) and job requests.
      operationId: get-notifications
      parameters:
        - name: key
          in: path
          required: true
          description: The recipient's username
          schema:
            type: string
          example: alice
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
              examples:
                Example:
                  value:
                    status: SUCCESS
                    notifications:
                      - id: 9b2e7c1a-0d4f-4e3b-a6c5-1f2e3d4c5b6a
                        recipient_id: provider-alice
                        recipient_username: alice
                        sender_username: bob
                        message: Are you still willing to join this FL session?
                        payload:
                          submission_id: sub-2026-10-14-001
                        read: false
                        read_at: null
                        created_at: '2026-10-14T10:15:00Z'
                        response: null
                        response_message: null
                        responded_at: null
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-codeSamples:
        - lang: cURL
          label: Get notifications
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/notifications/alice'

  /api/v1/notifications/by-sender/{key}:
    get:
      tags:
        - Notifications
      summary: Get Notifications Sent by a User
      description: |
        Returns every notification a user has sent, so an FL output owner can see each selected
        provider's response (`response` is `null` until they answer).
      operationId: get-notifications-by-sender
      parameters:
        - name: key
          in: path
          required: true
          description: The sender's username
          schema:
            type: string
          example: bob
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-codeSamples:
        - lang: cURL
          label: Get sent notifications
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/notifications/by-sender/bob'

  /api/v1/notifications/{key}/read:
    patch:
      tags:
        - Notifications
      summary: Mark Notification as Read
      description: |
        Marks one notification as read.
      operationId: patch-notification-read
      parameters:
        - $ref: '#/components/parameters/NotificationIdParam'
      requestBody:
        description: |
          - `username` : The recipient's username
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
            examples:
              Mark Read:
                value:
                  username: alice
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResult'
        '400':
          $ref: '#/components/responses/InvalidJSON'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-codeSamples:
        - lang: cURL
          label: Mark notification read
          source: |
            curl --location --request PATCH 'https://v2.dev.iudx.io/gov-layer/api/v1/notifications/<notificationId>/read' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/notifications/{key}/respond:
    post:
      tags:
        - Notifications
      summary: Respond to Notification
      description: |
        A provider accepts or declines a participation request, with an optional reason for the owner.

        For FL, accepting is the provider's agreement: when the notification's `payload` carries a
        `submission_id`, the provider is marked as signed on that session's contract.
      operationId: post-notification-respond
      parameters:
        - $ref: '#/components/parameters/NotificationIdParam'
      requestBody:
        description: |
          - `username` : The responding provider's username
          - `response` : `accepted` or `declined`
          - `message` : Optional reason
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                response:
                  type: string
                  enum:
                    - accepted
                    - declined
                message:
                  type: string
              required:
                - username
                - response
            examples:
              Accept:
                value:
                  username: alice
                  response: accepted
              Decline:
                value:
                  username: alice
                  response: declined
                  message: Dataset is being refreshed this week.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResult'
        '400':
          description: |-
            Bad Request
            - `MISSING_USERNAME` : `username` is missing
            - `INVALID_RESPONSE` : `response` is not `accepted` or `declined`
            - `INVALID_JSON` : the body is not valid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: INVALID_RESPONSE
                    message: response must be 'accepted' or 'declined'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-codeSamples:
        - lang: cURL
          label: Respond to notification
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/notifications/<notificationId>/respond' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/contract:
    post:
      tags:
        - Contracts
      summary: Submit Signed Contract
      description: |
        Submits a contract signed by the consumer and routes it by its `technique`.

        The consumer's Keycloak token is sent **in the body** (`access_token`, or `token`), not in a header.
        The `signature` is the consumer's hex-encoded signature over the JSON of `contract`, verified with
        the public key bound to that token.

        Pathways:

        * `FL` : fetches each dataset's provider form and policy from APD, stores the contract and returns `202`.
          The FL session itself is started by separate endpoints.
        * `TEE` / `SMPC` : when the deployment requires it, every data provider must have signed the contract first
          (`403 CONTRACT_NOT_SIGNED` otherwise). Each dataset is then authorized against its APD policy, the contract is
          stored and signed by the Governance Layer, and deployed to the enclave / SMPC executor.

        Errors from this endpoint are plain text, not JSON (except `CONTRACT_NOT_SIGNED`).
      operationId: post-contract
      requestBody:
        description: |
          - `access_token` : The consumer's Keycloak token (`token` is accepted instead)
          - `contract` : The contract; its `technique` picks the pathway
          - `signature` : The consumer's hex-encoded signature of `contract`
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type: string
                token:
                  type: string
                contract:
                  $ref: '#/components/schemas/Contract'
                signature:
                  type: string
                  description: hex-encoded
              required:
                - contract
                - signature
            examples:
              Submit SMPC Contract:
                value:
                  access_token: <tokenValue>
                  contract:
                    contract_id: 5c2b1e7a-3d4f-4a6b-9e8c-7d6f5e4a3b2c
                    technique: SMPC
                    parties:
                      data_providers:
                        - id: provider-alice
                          name: Alice
                          dataset_name: hospital-admissions-2025
                  signature: 3a5f9c...e81d
      responses:
        '200':
          description: OK (TEE / SMPC deployed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  pathway:
                    type: string
                    example: GENERAL
                  technique:
                    type: string
                    enum:
                      - TEE
                      - SMPC
                  orch_signature:
                    type: string
                    description: The Governance Layer's hex-encoded signature of the contract
                  contract_id:
                    type: string
              examples:
                Example:
                  value:
                    status: success
                    pathway: GENERAL
                    technique: SMPC
                    orch_signature: 7b1e4d...90af
                    contract_id: c-8f3a2b1c
        '202':
          description: Accepted (FL)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  pathway:
                    type: string
                    example: FL
                  datasets:
                    type: integer
                    description: Number of datasets on the contract
                  forms:
                    type: integer
                    description: Number of provider forms found in APD
              examples:
                Example:
                  value:
                    status: success
                    pathway: FL
                    datasets: 2
                    forms: 2
        '400':
          description: |-
            Bad Request (plain text)
            - `Invalid request body`, `Invalid contract`, `Invalid signature encoding`
            - `Contract missing technique field`, `Unsupported technique: <technique>`
            - `Contract missing datasets`
          content:
            text/plain:
              schema:
                type: string
              example: Contract missing technique field
        '401':
          description: |-
            Unauthorized (plain text)
            - `Invalid Keycloak token`, `Invalid token claims`
            - `Token missing bound public key`
            - `Contract signature verification failed`
          content:
            text/plain:
              schema:
                type: string
              example: Contract signature verification failed
        '403':
          description: |-
            Forbidden
            - `CONTRACT_NOT_SIGNED` (JSON) : not every data provider has signed the contract yet (TEE / SMPC)
            - `User not authorized by provider policy for dataset <id>` (plain text) : an APD policy does not allow this consumer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: CONTRACT_NOT_SIGNED
                    message: 'waiting on provider signatures: provider-alice (not signed)'
            text/plain:
              schema:
                type: string
              example: User not authorized by provider policy for dataset provider-alice
        '404':
          description: |-
            Not Found
            - `CONTRACT_NOT_FOUND` : no stored contract with this `contract_id` (TEE / SMPC, when signing is required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
        '500':
          description: |-
            Internal Server Error (plain text)
            - `Policy authorization failed for dataset <id>: <reason>`
            - `Failed to load orchestrator private key`, `Storage failed`, `Contract signing failed`
            - `Deployment failed: <reason>`
          content:
            text/plain:
              schema:
                type: string
              example: 'Deployment failed: enclave unreachable'
      security: []
      x-codeSamples:
        - lang: cURL
          label: Submit signed contract
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/contract' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

