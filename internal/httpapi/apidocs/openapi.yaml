                    approval: accepted
                    data_provider: accepted
                    infra_provider: accepted
                    job_approval: accepted
                    entries:
                      - id: 42
                        job_id: job-7d1e3c9a
                        type: infra-provider
                        provider_id: provider-ivan
                        item: infra-azure-cvm-01
                        status: accepted
                        has_role: true
