  /api/v1/job/approval/data-provider:
    post:
      tags:
        - Job Approval
      summary: Data Provider Approves Job
      description: |
        A data provider approves a job and signs its contract hash.

        * Each of the caller's own datasets on the job's contract is checked: the caller must hold the data-provider role
          and the dataset must be theirs in the DX catalogue. The result is recorded in the job's audit history.
        * When the caller's datasets are accepted, the signature is verified with their registered public key before anything
          is recorded; a bad signature is refused with `400 INVALID_SIGNATURE`.
        * For each accepted dataset an APD consumer grant (`grants`) and an IUDX APD policy (`iudx_policies`) are posted.
          A failed post is reported, never fails the approval; calling again retries it.

        `approval` is the caller's own result; `job_approval` is the whole job's.
      operationId: post-job-approval-data-provider
      requestBody:
        $ref: '#/components/requestBodies/ApprovalBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApprovalResult'
                  - type: object
                    properties:
                      grants:
                        type: array
                        items:
                          $ref: '#/components/schemas/GrantResult'
                      iudx_policies:
                        type: array
                        items:
                          $ref: '#/components/schemas/IudxPolicyResult'
              examples:
                Example:
                  value:
                    status: SUCCESS
                    job_id: job-7d1e3c9a
                    type: data-provider
                    approval: accepted
                    data_provider: accepted
                    infra_provider: pending
                    job_approval: pending
                    entries:
                      - id: 41
                        job_id: job-7d1e3c9a
                        type: data-provider
                        provider_id: provider-alice
                        item: b34eb955-c691-4fd3-b200-f18bc78810a2
                        status: accepted
                        has_role: true
                        in_catalogue: true
                        checked_at: '2026-10-14T10:20:00Z'
                    signature:
                      submitted: true
                      contract_hash: 9f2c4e6a8b0d1f3e5c7a9b1d3f5e7c9a1b3d5f7e9c1a3b5d7f9e1c3a5b7d9f1e
                      items_signed: 1
                      verified_at: GET /job/job-7d1e3c9a/status
                      verified: true
                    grants:
                      - item_type: dataset
                        item_id: b34eb955-c691-4fd3-b200-f18bc78810a2
                        policy_id: grant-job-7d1e3c9a-b34eb955
                        status: posted
                    iudx_policies:
                      - item_id: b34eb955-c691-4fd3-b200-f18bc78810a2
                        policy_id: 1c2d3e4f-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                        status: posted
        '400':
          description: |-
            Bad Request
            - `BAD_REQUEST` : invalid body, or `job_id` missing
            - `NO_APPROVAL_NEEDED` : the contract does not go through job approval — it names no dataset, or no infrastructure while `REQUIRE_INFRA_APPROVAL` is on (with it off, TEE/SMPC contracts with datasets but no selected infrastructure are approved on their data-provider approval alone)
            - `MISSING_FIELDS` : `contract_hash` or `signature` missing
            - `INVALID_SIGNATURE` : the hash is not this job's, the caller has no registered key, or the signature does not verify
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: MISSING_FIELDS
                    message: 'contract_hash and signature are required: sign the contract_hash from your job request with your private key'
        '401':
          $ref: '#/components/responses/DevTokenUnauthorized'
        '403':
          description: |-
            Forbidden
            - `NOT_A_DATA_PROVIDER_ON_CONTRACT` : the caller owns none of the job's datasets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Data provider approves job
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/job/approval/data-provider' \
              --header 'Authorization: Bearer <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/job/approval/infra-provider:
    post:
      tags:
        - Job Approval
      summary: Infra Provider Approves Job
      description: |
        An infra provider approves a job and signs its contract hash, for the caller's own infrastructures on the job's
        contract. The signature is stored as submitted and cross-verified at [Check Job Status](#operation/get-job-status).

        `approval` is the caller's own result; `job_approval` is the whole job's.
