      summary: List Workloads
      description: |
        Every workload a TEE contract can run (gov_layer's KnownWorkloads): `id` (sent as application_id / workload.id), `name`, `image`, `cpu`, `memory`, and `purposes` (the dataset purposes — research, clinical, benchmarking, internal — the workload is offered for on the dataset policy form).
      operationId: list-workloads
