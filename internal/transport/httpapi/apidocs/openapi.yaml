  /api/v1/contract:
    post:
      tags:
        - Contracts
      summary: Submit Signed Contract
      description: |
        Submits a contract signed by the consumer and routes it by its `technique`.

        The consumer's Keycloak token is sent **in the body** (`access_token`, or `token`), not in a header.
        The `signature` is the consumer's hex-encoded signature over the JSON of `contract`, verified with
        the public key bound to that token.

        Pathways:

        * `FL` : fetches each dataset's provider form and policy from APD, stores the contract and returns `202`.
          The FL session itself is started by separate endpoints.
        * `TEE` / `SMPC` : when the deployment requires it, every data provider must have signed the contract first
          (`403 CONTRACT_NOT_SIGNED` otherwise). Each dataset is then authorized against its APD policy, the contract is
          stored and signed by the Governance Layer, and deployed to the enclave / SMPC executor.

        Errors from this endpoint are plain text, not JSON (except `CONTRACT_NOT_SIGNED`).
      operationId: post-contract
      requestBody:
        description: |
          - `access_token` : The consumer's Keycloak token (`token` is accepted instead)
          - `contract` : The contract; its `technique` picks the pathway
          - `signature` : The consumer's hex-encoded signature of `contract`
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                access_token:
                  type: string
                token:
                  type: string
                contract:
                  $ref: '#/components/schemas/Contract'
                signature:
                  type: string
                  description: hex-encoded
              required:
                - contract
                - signature
            examples:
              Submit SMPC Contract:
                value:
                  access_token: <tokenValue>
                  contract:
                    contract_id: 5c2b1e7a-3d4f-4a6b-9e8c-7d6f5e4a3b2c
                    technique: SMPC
                    parties:
                      data_providers:
                        - id: provider-alice
                          name: Alice
                          dataset_name: hospital-admissions-2025
                  signature: 3a5f9c...e81d
      responses:
        '200':
          description: OK (TEE / SMPC deployed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  pathway:
                    type: string
                    example: GENERAL
                  technique:
                    type: string
                    enum:
                      - TEE
                      - SMPC
                  orch_signature:
                    type: string
                    description: The Governance Layer's hex-encoded signature of the contract
                  contract_id:
                    type: string
              examples:
                Example:
                  value:
                    status: success
                    pathway: GENERAL
                    technique: SMPC
                    orch_signature: 7b1e4d...90af
                    contract_id: c-8f3a2b1c
        '202':
          description: Accepted (FL)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  pathway:
                    type: string
                    example: FL
                  datasets:
                    type: integer
                    description: Number of datasets on the contract
                  forms:
                    type: integer
                    description: Number of provider forms found in APD
              examples:
                Example:
                  value:
                    status: success
                    pathway: FL
                    datasets: 2
                    forms: 2
        '400':
          description: |-
            Bad Request (plain text)
            - `Invalid request body`, `Invalid contract`, `Invalid signature encoding`
            - `Contract missing technique field`, `Unsupported technique: <technique>`
            - `Contract missing datasets`
          content:
            text/plain:
              schema:
                type: string
              example: Contract missing technique field
        '401':
          description: |-
            Unauthorized (plain text)
            - `Invalid Keycloak token`, `Invalid token claims`
            - `Token missing bound public key`
            - `Contract signature verification failed`
          content:
            text/plain:
              schema:
                type: string
              example: Contract signature verification failed
        '403':
          description: |-
            Forbidden
            - `CONTRACT_NOT_SIGNED` (JSON) : not every data provider has signed the contract yet (TEE / SMPC)
            - `User not authorized by provider policy for dataset <id>` (plain text) : an APD policy does not allow this consumer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: CONTRACT_NOT_SIGNED
                    message: 'waiting on provider signatures: provider-alice (not signed)'
            text/plain:
              schema:
                type: string
              example: User not authorized by provider policy for dataset provider-alice
        '404':
          description: |-
            Not Found
            - `CONTRACT_NOT_FOUND` : no stored contract with this `contract_id` (TEE / SMPC, when signing is required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
        '500':
          description: |-
            Internal Server Error (plain text)
            - `Policy authorization failed for dataset <id>: <reason>`
            - `Failed to load orchestrator private key`, `Storage failed`, `Contract signing failed`
            - `Deployment failed: <reason>`
          content:
            text/plain:
              schema:
                type: string
              example: 'Deployment failed: enclave unreachable'
      security: []
      x-codeSamples:
        - lang: cURL
          label: Submit signed contract
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/contract' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/contracts/{contractId}/sign:
    post:
      tags:
        - Signing and Consent
      summary: Sign Contract
      description: |
        A data provider signs the contract's hash and sends the signature back.

        * The signer is the user in the provider's own token, never the body. If `provider_username` is sent it must match.
        * The Governance Layer re-hashes its own stored copy of the contract; the stored hash, the fresh hash and
          `contract_hash` must all agree.
        * The contract must carry a valid Governance Layer signature, and the caller must be one of its data providers.
        * The signature is verified with the public key registered at
          [Register Provider Public Key](#operation/put-provider-key).
        * A contract that needs job approval can only be signed once the job is approved.

        The reply is only `{"status": "signed", ...}` or `{"status": "not signed", "message": <reason>}`, with the HTTP status of the failure.
      operationId: post-contract-sign
      parameters:
        - $ref: '#/components/parameters/ContractIdParam'
      requestBody:
        description: |
          - `contract_hash` : The hash from the sign request
          - `signature` : The provider's base64 RSA signature (RSASSA-PKCS1-v1_5, SHA-256) over `contract_hash`
          - `provider_username` : Optional, must match the token's user
          - `notification_id` : Optional, the sign request to mark answered
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contract_hash:
                  type: string
                signature:
                  type: string
                provider_username:
                  type: string
                notification_id:
                  type: string
              required:
                - contract_hash
                - signature
            examples:
              Sign Contract:
                value:
                  contract_hash: 9f2c4e6a8b0d1f3e5c7a9b1d3f5e7c9a1b3d5f7e9c1a3b5d7f9e1c3a5b7d9f1e
                  signature: kX9v2Lq...Q==
                  notification_id: 9b2e7c1a-0d4f-4e3b-a6c5-1f2e3d4c5b6a
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
              examples:
                Example:
                  value:
                    status: signed
                    message: sent to governance layer
        '400':
          description: |-
            Bad Request
            - `contract_hash` or `signature` missing
            - The contract is a draft (only the final roster contract is signed)
            - The provider has no registered public key
            - The signature does not verify
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
              examples:
                Example:
                  value:
                    status: not signed
                    message: contract_hash and signature are required
        '401':
          description: |-
            Unauthorized
            - Token missing, invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
              examples:
                Example:
                  value:
                    status: not signed
                    message: MISSING_AUTH_TOKEN
        '403':
          description: |-
            Forbidden
            - `provider_username` does not match the token's user
            - The caller is not a data provider on this contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
              examples:
                Example:
                  value:
                    status: not signed
                    message: NOT_A_PARTY
        '404':
          description: |-
            Not Found
            - No such contract (it may have been regenerated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
              examples:
                Example:
                  value:
                    status: not signed
                    message: contract not found — it may have been regenerated
        '409':
          description: |-
            Conflict
            - The job is not approved yet
            - The signed hash does not match the Governance Layer's copy of the contract
            - The contract has no valid Governance Layer signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
              examples:
                Example:
                  value:
                    status: not signed
                    message: signed hash does not match the governance layer's copy of the contract
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
        '502':
          description: |-
            Bad Gateway
            - The provider's public key could not be looked up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResult'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Sign contract
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/contracts/<contractId>/sign' \
              --header 'Authorization: Bearer <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/contracts/{contractId}/consent-expiry:
    post:
      tags:
        - Signing and Consent
      summary: Set Consent Expiry
      description: |
        A data provider sets when their consent on a TEE/SMPC consent request ends, before signing it.

        * The provider is the user in their own token, and must be a data provider on the contract who has not
          signed it yet (withdraw consent first to change it after signing).
        * `valid_until` must be in the future and no later than the contract's `lifecycle.valid_until`. A date
          (`YYYY-MM-DD`) means the end of that day, UTC.
        * It is stored as `data_providers[].constraints.consent_valid_until`, which is covered by the contract
          hash: the contract is re-hashed and re-signed by the governance layer, any signatures already given are
          cleared, the old sign requests are marked `superseded`, and every data provider is sent a new one.
        * The consumer gets a `CONSENT_EXPIRY_SET` notification and a `consent_expiry_set` contract event.
        * Once any provider's consent has expired, the run gate refuses the contract with `CONSENT_EXPIRED`.
        * Not available on contracts that go through job approval.
      operationId: post-contract-consent-expiry
      parameters:
        - $ref: '#/components/parameters/ContractIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - valid_until
              properties:
                valid_until:
                  type: string
            examples:
              Set Consent Expiry:
                value:
                  valid_until: '2026-11-30'
      responses:
        '200':
          description: OK. The updated contract, its new hash and the number of sign requests re-sent.
        '400':
          description: Bad or out-of-range `valid_until`, or not a TEE/SMPC contract.
        '401':
          $ref: '#/components/responses/ProviderTokenUnauthorized'
        '403':
          description: The caller is not a data provider on this contract.
        '404':
          description: Contract not found.
        '409':
          description: Already signed, or the contract goes through job approval.
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Set Consent Expiry
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/contracts/<contractId>/consent-expiry' \
              --header 'Authorization: Bearer <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/contracts/{contractId}/withdraw-consent:
    post:
      tags:
        - Signing and Consent
      summary: Withdraw Consent
      description: |
        A data provider withdraws the consent they gave by signing a TEE contract (DPDP Act 2023 s.6(4),
        DPDP Rules 2025 Rule 3(c)(i)).

        * The provider is the user in their own token.
        * Their signature on every party of theirs is cleared and `withdrawn_at` recorded. The contract hash does
          not change, so they can sign it again later to give consent again.
        * Any further TEE run on the contract is refused by the run gate with `consent withdrawn`. A run already
          in progress is not stopped.
        * TEE contracts only.
      operationId: post-contract-withdraw-consent
      parameters:
        - $ref: '#/components/parameters/ContractIdParam'
      requestBody:
        description: |
          - `notification_id` : Optional, the sign request to mark `withdrawn`
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_id:
                  type: string
            examples:
              Withdraw Consent:
                value:
                  notification_id: 9b2e7c1a-0d4f-4e3b-a6c5-1f2e3d4c5b6a
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Example:
                  value:
                    status: withdrawn
                    message: consent withdrawn
                    withdrawn_at: '2026-10-15T10:00:00Z'
        '400':
          description: |-
            Bad Request
            - The contract is not a TEE contract
        '401':
          description: |-
            Unauthorized
            - Token missing, invalid or expired
        '403':
          description: |-
            Forbidden
            - The caller is not a data provider on this contract
        '404':
          description: |-
            Not Found
            - No such contract
        '409':
          description: |-
            Conflict
            - The caller has not signed this contract, so there is nothing to withdraw
        '500':
          description: Internal Server Error
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Withdraw consent
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/contracts/<contractId>/withdraw-consent' \
              --header 'Authorization: Bearer <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/contracts/{contractId}/signatures:
    get:
      tags:
        - Signing and Consent
      summary: Get Contract Signatures
      description: |
        Re-verifies every signature on a contract and reports whether the run can start.
        `matching` / `can run` only when the contract is a final (signable) contract and every signature verifies.
      operationId: get-contract-signatures
