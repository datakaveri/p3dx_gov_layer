openapi: 3.0.2
info:
  title: DX Governance Layer API
  version: 1.0.0
  description: |-
    # Introduction
    The DX Governance Layer (`p3dx_gov_layer`) is the trust and policy service of the P3DX platform. It produces
    the contract that governs every privacy-preserving computation: Trusted Execution Environment (TEE),
    Federated Learning (FL) and Secure Multi-Party Computation (SMPC). It collects the approval and cryptographic
    signature of every data and infrastructure provider, records their consent, and authorises a computation only
    once its contract is complete, unaltered and valid.

    Core capabilities:
    - **Contract generation**: builds a contract from the consumer's choice of datasets, infrastructure and workload.
    - **Signing and consent**: the Governance Layer signs each contract hash, and every data provider counter-signs
      it with their registered RSA key. Providers can set an expiry on their consent and withdraw it (DPDP Act 2023).
    - **Job approval**: data and infrastructure providers approve a job, and the consumer cross-verifies every
      approval to finalise the contract.
    - **Run gate**: a TEE job starts only when the stored contract is unaltered, fully signed and within every
      provider's consent.
    - **Notifications**: sign requests and FL participation requests, delivered to each user's inbox and live stream.

    # Getting Started
    ## Server and base paths
    The examples in this document use the server `https://v2.dev.iudx.io/gov-layer`. Replace it with the host of
    your deployment.

    | Base path | Endpoints served |
    |-----------|------------------|
    | `/api/v1` | Most endpoints in this document |
    | `/governance` | An alias of `/api/v1`: every `/api/v1` endpoint is also served here, unchanged |
    | `/` (server root) | TEE execution (`/v1/tee/...`) and the FL client-VM endpoint (`/p3dx/...`) |

    ## Request samples
    - Replace `<tokenValue>` with an access token (see [Authentication](#section/Authentication)).
    - Replace `<payload>` with the request body shown next to the sample.
    - Replace path placeholders such as `<contractId>` with real identifiers.

    # Authentication
    Protected endpoints take a Keycloak access token in the `Authorization: Bearer <tokenValue>` header. Tokens are
    issued by the DX Keycloak realm. The single exception is `POST /contract`, which takes the token in the
    request body.

    The caller's identity is always taken from the token. A username sent in a request body is never trusted on
    its own.

    ## Roles
    Users hold DX realm roles in Keycloak. Roles are requested from, and approved in, dx-controlplane.

    | Realm role | Holder |
    |------------|--------|
    | `consumer` | Data consumer: generates contracts and runs jobs |
    | `provider` | Data provider: publishes datasets and signs contracts |
    | `infra_provider` | Infrastructure provider: publishes infrastructure and approves jobs that run on it |
    | `application_provider` | Application provider |
    | `cos_admin` | Platform administrator |
    | `fl-orchestrator` | Service-account role of the FL orchestrator |

    `data-provider` and `infra-provider` appear in paths (`/provider-keys/{role}`, `/job/approval/...`) and as party
    types inside contracts. They are identifiers, not realm roles; a token holding `provider` is accepted where
    `data-provider` is required.

    ## Endpoint access
    | Endpoint | Credential | Caller |
    |----------|------------|--------|
    | [(PUT) /provider-keys/{role}](#operation/put-provider-key), [(GET) /provider-keys/{role}/status](#operation/get-provider-key-status) | Keycloak token | Data provider, infrastructure provider |
    | [(GET) /workloads](#operation/list-workloads) | Keycloak token | Any signed-in user |
    | [(POST) /generate-contract](#operation/post-generate-contract) | Keycloak token | Consumer |
    | [(GET, PUT) /contracts/{contractId}](#operation/get-contract) | Keycloak token | The consumer who generated the contract |
    | [(GET) /contract/{sessionId}](#operation/get-contract-by-session), [(GET) /contracts/by-project/{projectId}](#operation/get-contract-by-project) | Keycloak token | Any signed-in user |
    | [(POST) /contract](#operation/post-contract) | Keycloak token, in the body | Consumer |
    | [(POST) /contracts/{contractId}/sign](#operation/post-contract-sign), [consent-expiry](#operation/post-contract-consent-expiry), [withdraw-consent](#operation/post-contract-withdraw-consent) | Keycloak token | A data provider on the contract |
    | [(GET) /contracts/{contractId}/signatures](#operation/get-contract-signatures), [(GET) /contracts/by-session/{sessionId}/signatures](#operation/get-session-contract-signatures) | Keycloak token | Any signed-in user |
    | [(GET) /job/{jobId}/contract/{contractId}](#operation/get-job-contract) | Keycloak token | The job's consumer, data providers and infrastructure providers |
    | [(POST) /job/approval/data-provider](#operation/post-job-approval-data-provider) | Keycloak token | A data provider on the job |
    | [(POST) /job/approval/infra-provider](#operation/post-job-approval-infra-provider) | Keycloak token | An infrastructure provider on the job |
    | [(GET) /job/{jobId}/status](#operation/get-job-status), [(POST) /job/{jobId}/tee](#operation/post-job-tee) | Keycloak token | The job's consumer |
    | [(POST) /v1/tee/run](#operation/post-tee-run), [(GET) /v1/tee/jobs/{jobId}](#operation/get-tee-job), [(GET) /v1/tee/jobs/{jobId}/result](#operation/get-tee-job-result) | Keycloak token | Consumer |
    | (GET, POST) /me/... | Keycloak token | Any signed-in user; `GET /me/sign-requests` requires `provider` |
    | (GET, POST) /me/fl/..., [(GET) /sessions/{submissionId}/removed-providers](#operation/get-removed-providers) | Keycloak token | FL output owner; `POST /me/fl/vm-credentials` requires `provider` |
    | [(GET) /final-model/summary](#operation/get-final-model-summary), [(GET) /fl-output/{submissionId}](#operation/get-fl-output), [download](#operation/get-fl-output-download) | Keycloak token | The FL session's output owner |
    | [(GET) /governance/ca-cert](#operation/get-governance-ca-cert) | None | Public |
    | [(POST) /p3dx/fl/vm-token](#operation/post-fl-vm-token) | Offline token, in the body | FL client VM |

    # TEE Workflow
    The complete path of a TEE job, in order. Steps marked *(external)* are served by other platform services and
    are listed so that the sequence is clear.

    **1. Sign in and obtain a role** *(external: Keycloak, dx-controlplane)*
    1. Sign in: `POST {keycloak}/realms/{realm}/protocol/openid-connect/token` (`grant_type=password`).
    2. Read the profile: `GET {controlplane}/iudx/v2/auth/user`.
    3. New users hold `consumer`. To become a provider, request `provider`, `infra_provider` or
       `application_provider` with `POST {controlplane}/iudx/v2/auth/roles/requests`, and follow it with
       `GET {controlplane}/iudx/v2/auth/roles/requests/my`.
    4. A `cos_admin` approves the request (`PUT {controlplane}/iudx/v2/auth/admin/roles/requests/{requestId}`).
       The role is present in the user's next token.

    **2. Data provider: register a signing key**
    1. [Get Provider Public Key Status](#operation/get-provider-key-status). If no key is registered, the UI
       generates an RSA key pair in the browser and registers the public key with
       [Register Provider Public Key](#operation/put-provider-key). The private key never leaves the provider.

    **3. Consumer: generate the contract**
    1. Choose the workload: [List Workloads](#operation/list-workloads).
    2. [Generate Contract](#operation/post-generate-contract) with `datasets`, `technique` = `TEE`,
       `application_id` and `purpose`. The contract is stored and signed by the Governance Layer, and every data
       provider receives a `CONTRACT_SIGN` request. A second request for the same datasets while one is still
       pending returns `409 CONTRACT_PENDING`.
    3. Optionally, edit the contract while it is unsigned: [Edit Contract](#operation/edit-contract).

    **4. Data provider: review, consent and sign**
    1. List sign requests: [Get My Contract Sign Requests](#operation/get-my-sign-requests). New requests are also
       pushed on [Stream My New Notifications](#operation/get-my-notifications-stream).
    2. Sign the `contract_hash` with the private key from step 2: [Sign Contract](#operation/post-contract-sign).
    3. Optionally, [Set Consent Expiry](#operation/post-contract-consent-expiry) before signing, or
       [Withdraw Consent](#operation/post-contract-withdraw-consent) afterwards.

    **5. Consumer: confirm every signature**
    1. Poll [Get Contract Signatures](#operation/get-contract-signatures) until every party is valid.

    **6. Consumer: run the job**
    1. [Run TEE Job](#operation/post-tee-run) with `contract_id`. The run gate verifies that the stored contract
       still matches its hash, that the Governance Layer signature is valid, that every data provider has signed
       and that no consent has expired or been withdrawn.
    2. Follow progress: [Get TEE Job Progress](#operation/get-tee-job).
    3. Read the result: [Get TEE Job Result](#operation/get-tee-job-result).
    4. The job and its history are listed in [Get My Jobs](#operation/get-my-jobs).

    # Job Approval Workflow
    A contract that names infrastructure as well as datasets is approved as a job instead of being signed
    directly (steps 4 and 5 above):
    1. Each provider registers a public key: [Register Provider Public Key](#operation/put-provider-key).
    2. The consumer generates the contract, which returns `job_id`, `contract_id` and `contract_hash`.
    3. Each provider finds the job in [Get My Jobs](#operation/get-my-jobs) (`participation.status` =
       `requested`) and reads the contract with [Get Job Contract](#operation/get-job-contract).
    4. Each data provider and infrastructure provider approves the job and signs the `contract_hash`:
       [Data Provider Approves Job](#operation/post-job-approval-data-provider),
       [Infra Provider Approves Job](#operation/post-job-approval-infra-provider).
    5. The consumer cross-verifies every approval and signature with [Check Job Status](#operation/get-job-status),
       which finalises the contract.
    6. The consumer enables the TEE run: [Enable Job TEE Run](#operation/post-job-tee).

    # Errors
    Errors are returned as JSON in a common envelope:

    ```json
    { "status": "FAILED", "error": "CONTRACT_NOT_SIGNED", "message": "waiting on provider signatures" }
    ```

    `error` is a stable, machine-readable code and `message` is a human-readable explanation. Two endpoints,
    [Submit Signed Contract](#operation/post-contract) and [Generate Contract](#operation/post-generate-contract),
    return most errors as plain text; their responses are documented individually.

    Besides the codes listed for each endpoint, the API gateway in front of the service can return other 4xx and
    5xx responses. Clients should handle these generically.
  # ---------------------------------------------------------------------------
  # Commented out: p3dx-apd is not deployed on dev yet. When it is, restore these
  # steps into the TEE Workflow above, between "register a signing key" and
  # "generate the contract", and renumber.
  #
  # **3. Data provider: publish the dataset** *(external: p3dx-apd)*
  # 1. Register the dataset and its access policy: `POST {apd}/api/v1/me/policies` with
  #    `rules.policy_type` = `data-provider`, `dataset_id`, `data_url` (the data's location) and
  #    `rules.key_resource_path` (the KBS key path). Requires the `provider` role.
  # 2. List or remove it: `GET {apd}/api/v1/me/policies/datasets`,
  #    `GET` / `DELETE {apd}/api/v1/me/policies/datasets/{itemId}`.
  # 3. An infrastructure provider publishes infrastructure the same way
  #    (`rules.policy_type` = `infra-provider`, `infra_provider` role).
  #
  # **4. Consumer: choose the data** *(external: p3dx-apd)*
  # 1. Browse datasets: `GET {apd}/api/v1/catalogue/datasets`, and infrastructure:
  #    `GET {apd}/api/v1/catalogue/infrastructure`.
  # ---------------------------------------------------------------------------
  contact:
    name: CDPG Support
    email: support@datakaveri.org
    url: https://dataforpublicgood.org.in/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://v2.dev.iudx.io/gov-layer
    description: Development
tags:
  - name: Provider Keys
    description: |
      Registration of each provider's contract-signing RSA public key. Every provider signature on a contract or
      job approval is verified against the key registered here.
  - name: Workloads
    description: |
      The catalogue of workloads (container images and resource profiles) that a TEE contract can run.
  - name: Contracts
    description: |
      Generation, retrieval and editing of contracts for TEE, SMPC and FL. A contract records the parties, datasets,
      workload, purpose and validity of a computation, and is identified by its `contract_id` and `contract_hash`.
  - name: Signing and Consent
    description: |
      Data-provider signatures over a contract's hash, consent expiry and consent withdrawal, and verification of
      the signatures on a contract.
  - name: Job Approval
    description: |
      Approval of jobs whose contract names both datasets and infrastructure: providers read the job's contract,
      approve and sign it, and the consumer cross-verifies every approval before enabling the TEE run.
  - name: TEE Execution
    description: |
      Starting a fully signed TEE contract on the Kata coordinator, following its progress and reading its result.
      Served at the server root, not under `/api/v1`.
  - name: My Account
    description: |
      The signed-in user's own notifications, sign requests, jobs and projects. The user is always taken from the
      token.
  - name: FL Sessions
    description: |
      The FL output owner's session flow: request data providers, confirm the final roster, then queue, start or
      restart the session.
  - name: FL Outputs
    description: |
      The results of a finished FL session (metrics and the final global model), available to the session's output
      owner.
  - name: FL Infrastructure
    description: |
      Trust and credential endpoints used by FL client VMs. `POST /p3dx/fl/vm-token` is served at the server root.
x-tagGroups:
  - name: Onboarding
    tags:
      - Provider Keys
      - Workloads
  - name: Contracts and Consent
    tags:
      - Contracts
      - Signing and Consent
      - Job Approval
  - name: Execution
    tags:
      - TEE Execution
  - name: User
    tags:
      - My Account
  - name: Federated Learning
    tags:
      - FL Sessions
      - FL Outputs
      - FL Infrastructure
paths:
  /api/v1/provider-keys/{role}:
    put:
      tags:
        - Provider Keys
      summary: Register Provider Public Key
      description: |
        Registers (or replaces) the caller's contract-signing public key. Contract and job-approval
        signatures from this provider are verified against it.

        * The key is stored under the username in the caller's token, never one from the body.
        * The caller must hold the `{role}` realm role. A dev Keycloak token's `provider` role also counts as `data-provider`.
        * The key must be an RSA public key of at least 2048 bits, in SPKI PEM form (`-----BEGIN PUBLIC KEY-----`).
        * The key is per user: one key serves both provider roles.
        * `rotated` is `true` when an existing key was replaced.
      operationId: put-provider-key
      parameters:
        - $ref: '#/components/parameters/RoleParam'
      requestBody:
        description: |
          - `public_key_pem` : The provider's RSA public key in SPKI PEM form
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public_key_pem:
                  type: string
              required:
                - public_key_pem
            examples:
              Register Public Key:
                value:
                  public_key_pem: "-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...\n-----END PUBLIC KEY-----\n"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  fingerprint_sha256:
                    type: string
                    description: SHA-256 of the key's DER bytes, hex-encoded
                  rotated:
                    type: boolean
              examples:
                Example:
                  value:
                    status: SUCCESS
                    fingerprint_sha256: 3f1c9a0e5b7d2c4a8e6f1b3d5c7a9e0f2b4d6c8a0e2f4b6d8c0a2e4f6b8d0c2a
                    rotated: false
        '400':
          description: |-
            Bad Request
            - `ROLE_NOT_ALLOWED` : `{role}` is not `data-provider` or `infra-provider`
            - `MISSING_PUBLIC_KEY`, `PRIVATE_KEY_NOT_ACCEPTED`, `EXPECTED_SPKI_PEM`, `INVALID_PUBLIC_KEY`, `EXPECTED_RSA_KEY`, `KEY_TOO_SHORT` : the key is not acceptable
            - `INVALID_JSON` : the body is not valid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: KEY_TOO_SHORT
        '401':
          $ref: '#/components/responses/ProviderTokenUnauthorized'
        '403':
          description: |-
            Forbidden
            - `INSUFFICIENT_ROLE` : the token does not hold the `{role}` realm role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: INSUFFICIENT_ROLE
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Register public key
          source: |
            curl --location --request PUT 'https://v2.dev.iudx.io/gov-layer/api/v1/provider-keys/data-provider' \
              --header 'Authorization: Bearer <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/provider-keys/{role}/status:
    get:
      tags:
        - Provider Keys
      summary: Get Provider Public Key Status
      description: |
        Shows whether the caller already has a public key registered. `{role}` only checks that the
        caller holds that role; the key itself is per user.
      operationId: get-provider-key-status
      parameters:
        - $ref: '#/components/parameters/RoleParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  exists:
                    type: boolean
              examples:
                Key registered:
                  value:
                    status: SUCCESS
                    exists: true
                No key yet:
                  value:
                    status: SUCCESS
                    exists: false
        '400':
          description: |-
            Bad Request
            - `ROLE_NOT_ALLOWED` : `{role}` is not `data-provider` or `infra-provider`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: ROLE_NOT_ALLOWED
        '401':
          $ref: '#/components/responses/ProviderTokenUnauthorized'
        '403':
          description: |-
            Forbidden
            - `INSUFFICIENT_ROLE` : the token does not hold the `{role}` realm role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: INSUFFICIENT_ROLE
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Get public key status
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/provider-keys/data-provider/status' \
              --header 'Authorization: Bearer <tokenValue>'

  /api/v1/workloads:
    get:
      tags:
        - Workloads
      summary: List Workloads
      description: |
        Lists every workload that a TEE contract can run. Each entry has:

        * `id` : the workload identifier, sent as `application_id` to Generate Contract or as `workload.id` to Edit Contract
        * `name`, `image` : the display name and container image
        * `cpu`, `memory` : the resources allocated to the workload
        * `purposes` : the dataset purposes the workload is offered for (`research`, `clinical`, `benchmarking`, `internal`)
      operationId: list-workloads
      responses:
        '200':
          description: OK. The workload catalogue.
        '401':
          $ref: '#/components/responses/ProviderTokenUnauthorized'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: List workloads
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/workloads' \
              --header 'Authorization: Bearer <tokenValue>'

  /api/v1/generate-contract:
    post:
      tags:
        - Contracts
      summary: Generate Contract
      description: |
        Builds an unsigned contract from the consumer's dataset and technique selection, stores it as a draft
        and returns it. Regenerating the same selection replaces the same draft (with a new `contract_id`),
        except while a TEE / SMPC contract for it is still waiting on its providers: that returns
        `409 CONTRACT_PENDING` with the waiting contract.

        For every selected dataset the APD policy is fetched (and, for FL, the provider form). A missing policy
        never fails the request. For TEE / SMPC without an APD policy, the dataset's DX catalogue owner is taken
        as its provider.

        What happens next depends on the contract:

        * **Datasets and infra (job approval)** : the contract is hashed and stored with its `contract_hash`, and
          each data and infra provider is sent a job request. `signing` is `on_hold_pending_approval`; see the
          [Job Approval](#tag/Job-Approval) endpoints.
        * **Other TEE / SMPC** : the Governance Layer signs the hash and sends each data provider a `CONTRACT_SIGN`
          request. `signing` is `requested`.
        * **FL** : nothing is sent yet; FL is signed on its final roster contract. `signing` is `not_applicable`.

        Errors from this endpoint are plain text, not JSON.
      operationId: post-generate-contract
      requestBody:
        description: |
          - `datasets` : The selected datasets, each with `dataset_id` and `dataset_name`
          - `technique` : `FL`, `TEE` or `SMPC`
          - `application_id` : Optional, the application to run
          - `provider_id` : Optional, overrides the provider named by the APD policy
          - `compute_choice` : Optional, defaulted per technique
          - `infra_ids` : The selected infrastructures; SMPC needs exactly 2, optional for TEE
          - `purpose` : The specific purpose of processing, shown to data providers in the DPDP Rule 3 consent
            notice and covered by the contract hash. Required for TEE; at most 1000 characters
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                datasets:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      dataset_id:
                        type: string
                      dataset_name:
                        type: string
                technique:
                  type: string
                  enum:
                    - FL
                    - TEE
                    - SMPC
                application_id:
                  type: string
                provider_id:
                  type: string
                compute_choice:
                  type: string
                infra_ids:
                  type: array
                  items:
                    type: string
                purpose:
                  type: string
                  maxLength: 1000
              required:
                - datasets
                - technique
            examples:
              TEE with infra (job approval):
                value:
                  datasets:
                    - dataset_id: b34eb955-c691-4fd3-b200-f18bc78810a2
                      dataset_name: hospital-admissions-2025
                  technique: TEE
                  infra_ids:
                    - infra-azure-cvm-01
              SMPC:
                value:
                  datasets:
                    - dataset_id: b34eb955-c691-4fd3-b200-f18bc78810a2
                      dataset_name: hospital-admissions-2025
                  technique: SMPC
                  infra_ids:
                    - infra-node-a
                    - infra-node-b
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  contract:
                    $ref: '#/components/schemas/Contract'
                  sign_requests_sent:
                    type: integer
                  signing:
                    type: string
                    enum:
                      - not_applicable
                      - on_hold_pending_approval
                      - requested
                  approval_required:
                    type: boolean
                    description: '`true` when the contract names both datasets and infra'
                  providers_notified:
                    type: integer
                    description: Number of job requests sent (job approval only)
              examples:
                Job approval:
                  value:
                    status: success
                    contract:
                      job_id: job-7d1e3c9a
                      contract_id: 5c2b1e7a-3d4f-4a6b-9e8c-7d6f5e4a3b2c
                      technique: TEE
                      contract_hash: 9f2c4e6a8b0d1f3e5c7a9b1d3f5e7c9a1b3d5f7e9c1a3b5d7f9e1c3a5b7d9f1e
                    sign_requests_sent: 0
                    signing: on_hold_pending_approval
                    approval_required: true
                    providers_notified: 2
        '400':
          description: |-
            Bad Request (plain text)
            - `Invalid request body`
            - `at least one dataset is required`
            - `technique must be one of FL, TEE, SMPC`
            - `exactly 2 infra_ids are required for SMPC`
          content:
            text/plain:
              schema:
                type: string
              example: exactly 2 infra_ids are required for SMPC
        '401':
          description: |-
            Unauthorized (plain text)
            - `Invalid Keycloak token`, `Invalid token claims`
          content:
            text/plain:
              schema:
                type: string
              example: Invalid Keycloak token
        '409':
          description: |-
            Conflict
            - `CONTRACT_PENDING` : a contract for the same datasets and technique is still waiting for its providers
              (not fully signed, not rejected or withdrawn, not expired). It is returned in `contract`, with its
              `contract_id` and `job_id`.
          content:
            application/json:
              example:
                status: FAILED
                error: CONTRACT_PENDING
                message: A contract for these datasets is already waiting for the providers' approval. Wait for it to be approved, rejected or to expire before requesting again.
                contract_id: 5c2b1e7a-3d4f-4a6b-9e8c-7d6f5e4a3b2c
                job_id: job-7d1e3c9a
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Generate contract
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/generate-contract' \
              --header 'Authorization: Bearer <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/contracts/{contractId}:
    get:
      tags:
        - Contracts
      summary: Get Contract
      description: |
        The stored contract, for the consumer who generated it (their Keycloak token's `sub` must be
        `parties.user.id`). Used by the consent request preview to pick up later changes, such as a data
        provider's consent expiry.
      operationId: get-contract
      parameters:
        - $ref: '#/components/parameters/ContractIdParam'
      responses:
        '200':
          description: 'OK. `{"status": "SUCCESS", "contract": {...}}`'
        '401':
          description: Invalid Keycloak token.
        '403':
          description: Not the consumer who generated this contract.
        '404':
          description: Contract not found.
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Get Contract
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/contracts/<contractId>' \
              --header 'Authorization: Bearer <tokenValue>'
    put:
      tags:
        - Contracts
      summary: Edit Contract
      description: |
        The consumer who generated a TEE contract edits it in place; the `contract_id` is unchanged. Every field is
        optional, and omitted fields keep their value.

        Editable fields:
        * `lifecycle.valid_from`, `lifecycle.valid_until`
        * the consumer's name
        * each data provider's dataset name, dataset version, data URL and key resource path
        * the workload (another workload from List Workloads, or its image, CPU and memory)

        The contract ID, hash, signatures, technique and party identities can never be changed.

        The contract is not re-hashed or re-signed. Once edited, it no longer matches the hash its data providers
        signed, and [Run TEE Job](#operation/post-tee-run) refuses it with `CONTRACT_NOT_SIGNED`.
      operationId: edit-contract
      parameters:
        - $ref: '#/components/parameters/ContractIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lifecycle:
                  type: object
                  properties:
                    valid_from:
                      type: string
                      format: date-time
                    valid_until:
                      type: string
                      format: date-time
                user:
                  type: object
                  properties:
                    name:
                      type: string
                data_providers:
                  type: array
                  description: Positional — entry i edits parties.data_providers[i].
                  items:
                    type: object
                    properties:
                      dataset_name:
                        type: string
                      dataset_version:
                        type: string
                      data_url:
                        type: string
                      key_resource_path:
                        type: string
                workload:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Switch to another workload from GET /workloads.
                    image:
                      type: string
                    cpu:
                      type: string
                    memory:
                      type: string
      responses:
        '200':
          description: OK. The contract was updated; `changes` lists each edit, and `hash_matches` is `false` once the content differs from the signed hash.
        '400':
          description: Nothing changed, invalid value, or not a TEE contract.
        '401':
          description: Missing or invalid Keycloak token.
        '403':
          description: Caller is not the consumer who generated the contract.
        '404':
          $ref: '#/components/responses/ContractNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Edit contract
          source: |
            curl --location --request PUT 'https://v2.dev.iudx.io/gov-layer/api/v1/contracts/<contractId>' \
              --header 'Authorization: Bearer <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '{"workload": {"cpu": "2"}, "lifecycle": {"valid_until": "2027-06-30T00:00:00Z"}}'

