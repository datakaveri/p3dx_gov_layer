#
# /p3dx/internal/fl/vm-credentials/{id}/delivered:
#   post:
#     tags:
#       - FL Client-VM Credentials
#     summary: Confirm FL Client-VM Credential Delivery
#     description: |
#       p3dx-fl-orchestrator confirms it delivered a VM credential to the VM. Needs a Keycloak service-account
#       token for the orchestrator client with the `fl-orchestrator` role.
#     operationId: post-fl-vm-credential-delivered
#     parameters:
#       - name: id
#         in: path
#         required: true
#         description: The `credential_id`
#         schema:
#           type: string
#     responses:
#       '200':
#         description: '`{status, credential_id, state}`'
#       '401':
#         description: Missing or invalid service token
#       '403':
#         description: The token is not the orchestrator's, or lacks the `fl-orchestrator` role
#       '404':
#         description: '`UNKNOWN_CREDENTIAL`'
#       '409':
#         description: '`CREDENTIAL_EXPIRED`'
#       '503':
#         description: '`CREDENTIAL_STORE_UNAVAILABLE`'
#     security:
#       - authorization: []
#     x-codeSamples:
#       - lang: cURL
#         label: Confirm credential delivery
#         source: |
#           curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/p3dx/internal/fl/vm-credentials/<credentialId>/delivered' \
#             --header 'Authorization: Bearer <tokenValue>'
#

components:
  securitySchemes:
    authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Keycloak access token (JWT) issued by the DX realm, sent as `Authorization: Bearer <tokenValue>`'
    vmRegistryToken:
      type: apiKey
      in: header
      name: X-VM-Registry-Token
      description: Shared secret; only checked when the deployment sets `VM_REGISTRY_TOKEN`
  parameters:
    FLSubmissionParam:
      name: submissionId
      in: path
      required: true
      description: The raw FL submission id (the contract's session_id)
      schema:
        type: string
    RoleParam:
      name: role
      in: path
      required: true
      description: The provider role the caller holds
      schema:
        type: string
        enum:
          - data-provider
          - infra-provider
    NotificationIdParam:
      name: key
      in: path
      required: true
      description: The notification's id
      schema:
        type: string
    SessionIdParam:
      name: sessionId
      in: path
      required: true
      description: The FL session (submission) id
      schema:
        type: string
    ContractIdParam:
      name: contractId
      in: path
      required: true
      description: The contract's id
      schema:
        type: string
    JobIdParam:
      name: jobId
      in: path
      required: true
      description: The job's id (from Generate Contract)
      schema:
        type: string
    ModelSessionParam:
      name: session_id
      in: query
      required: false
      description: The FL session; defaults to the newest session
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_-]+$
    ModelRoundParam:
      name: round
      in: query
      required: false
      description: The round; defaults to the session's final round
      schema:
        type: integer
        minimum: 0
  requestBodies:
    ApprovalBody:
      description: |
        - `job_id` : The job to approve
        - `contract_hash` : The hash from the job request
        - `signature` : The provider's base64 RSA signature (RSASSA-PKCS1-v1_5, SHA-256) over `contract_hash`
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              job_id:
                type: string
              contract_hash:
                type: string
              signature:
                type: string
            required:
              - job_id
              - contract_hash
              - signature
          examples:
            Approve Job:
              value:
                job_id: job-7d1e3c9a
                contract_hash: 9f2c4e6a8b0d1f3e5c7a9b1d3f5e7c9a1b3d5f7e9c1a3b5d7f9e1c3a5b7d9f1e
                signature: kX9v2Lq...Q==
  responses:
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: INTERNAL_ERROR
    InvalidJSON:
      description: |-
        Bad Request
        - `INVALID_JSON` : the body is not valid JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: INVALID_JSON
                message: Invalid JSON in request body
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: NOT_FOUND
    ContractNotFound:
      description: |-
        Not Found
        - No such contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: CONTRACT_NOT_FOUND
    JobNotFound:
      description: |-
        Not Found
        - No contract for this `job_id`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: NOT_FOUND
                message: No contract for this job_id
    ProviderTokenUnauthorized:
      description: |-
        Unauthorized
        - `MISSING_AUTH_TOKEN` : no Bearer token
        - `INVALID_OR_EXPIRED_TOKEN` : the token is invalid or expired
        - `INVALID_TOKEN_CLAIMS` : the token has no username or `sub`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: INVALID_OR_EXPIRED_TOKEN
    DevTokenUnauthorized:
      description: |-
        Unauthorized
        - `MISSING_AUTH_TOKEN` : no Bearer token
        - `INVALID_OR_EXPIRED_TOKEN` : the token is not a valid DX Keycloak token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: MISSING_AUTH_TOKEN
                message: send the consumer's dev Keycloak token as the Bearer token
    VMRegistryUnauthorized:
      description: |-
        Unauthorized
        - `UNAUTHORIZED` : `X-VM-Registry-Token` is missing or wrong
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: UNAUTHORIZED
                message: invalid or missing X-VM-Registry-Token
    ContractResult:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: SUCCESS
              contract:
                $ref: '#/components/schemas/Contract'
    SignatureStatus:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              signatures:
                type: string
                enum:
                  - matching
                  - not matching
              tee:
                type: string
                enum:
                  - can run
                  - cannot run
          examples:
            All signed:
              value:
                signatures: matching
                tee: can run
            Not all signed:
              value:
                signatures: not matching
                tee: cannot run
    ModelBadRequest:
      description: |-
        Bad Request
        - `INVALID_SESSION_ID` : `session_id` has characters other than letters, digits, `-` and `_`
        - `INVALID_ROUND` : `round` is not a non-negative integer
        - `INVALID_PATH`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: INVALID_ROUND
    NoModel:
      description: |-
        Not Found
        - `NO_MODEL` : no checkpoints yet, or none for that session / round
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: NO_MODEL
                message: No model for that session.
  schemas:
    Failed:
      type: object
      properties:
        status:
          type: string
          example: FAILED
        error:
          type: string
          description: Error code
        message:
          type: string
        detail:
          type: string
    DataProvider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
    Notification:
      type: object
      properties:
        id:
          type: string
        recipient_id:
          type: string
        recipient_username:
          type: string
        sender_username:
          type: string
        message:
          type: string
        payload:
          type: object
          additionalProperties: true
        read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        response:
          type: string
          nullable: true
          enum:
            - accepted
            - declined
            - null
          description: '`null` until the recipient answers'
        response_message:
          type: string
          nullable: true
        responded_at:
          type: string
          format: date-time
          nullable: true
    CreatedNotification:
      type: object
      properties:
        id:
          type: string
        recipientId:
          type: string
        recipientUsername:
          type: string
        senderUsername:
          type: string
        message:
          type: string
        payload:
          type: object
          additionalProperties: true
        read:
          type: boolean
        created_at:
          type: string
    NotificationList:
      type: object
      properties:
        status:
          type: string
          example: SUCCESS
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    NotificationResult:
      type: object
      properties:
        status:
          type: string
          example: SUCCESS
        notification:
          $ref: '#/components/schemas/Notification'
    Project:
      type: object
      properties:
        project_id:
          type: string
        session_id:
          type: string
        data_provider_usernames:
          type: array
          items:
            type: string
    Signature:
      type: object
      properties:
