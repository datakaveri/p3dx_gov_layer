#           application/json:
#             schema:
#               $ref: '#/components/schemas/Failed'
#             examples:
#               Example:
#                 value:
#                   status: FAILED
#                   error: NOT_FOUND
#                   message: no output-owner VM registered yet
#       '500':
#         $ref: '#/components/responses/InternalError'
#     security:
