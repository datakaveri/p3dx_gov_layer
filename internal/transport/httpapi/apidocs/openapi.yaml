          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: CONTRACT_NOT_FINAL
                    message: 'the job''s contract is not final yet: every data and infra provider must approve it, then GET /job/job-7d1e3c9a/status must return approved'
        '500':
