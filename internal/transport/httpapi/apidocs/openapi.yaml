          type: string
          format: date-time
          nullable: true
        signer:
          type: string
          description: Username whose public key verifies `value`
        algorithm:
          type: string
          example: RSASSA-PKCS1-v1_5-SHA256
        signed_hash:
          type: string
          description: The contract hash that was signed
        value:
          type: string
          description: base64 signature
    Constraints:
      type: object
      properties:
        accessibility_level:
          type: string
        restricted_to:
          type: array
          items:
            type: string
    Contract:
      type: object
      description: The contract shared by FL, TEE and SMPC.
      properties:
        project_id:
          type: string
        contract_id:
          type: string
        job_id:
          type: string
        version:
          type: integer
        lifecycle:
          type: object
          properties:
            created_at:
              type: string
              format: date-time
            valid_from:
              type: string
              format: date-time
            valid_until:
              type: string
              format: date-time
        technique:
          type: string
          enum:
            - FL
            - TEE
            - SMPC
        compute_choice:
          type: string
        parties:
          type: object
          properties:
            user:
              type: object
              description: The consumer
              properties:
                id:
                  type: string
                name:
                  type: string
                datablob_url:
                  type: string
                signature:
                  $ref: '#/components/schemas/Signature'
            data_providers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  dataset_id:
                    type: string
                  dataset_name:
                    type: string
                  dataset_version:
                    type: string
                  data_url:
                    type: string
                  constraints:
                    $ref: '#/components/schemas/Constraints'
                  trustee:
                    type: object
                    properties:
                      kbs_url:
                        type: string
                      key_resource_path:
                        type: string
                  signature:
                    $ref: '#/components/schemas/Signature'
            data_provider_count:
              type: integer
            application_providers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  app_name:
                    type: string
                  container_image:
                    type: string
                  container_digest:
                    type: string
                  constraints:
                    $ref: '#/components/schemas/Constraints'
                  signature:
                    $ref: '#/components/schemas/Signature'
            infra_providers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  region:
                    type: string
                  attestation:
                    type: object
                    properties:
                      required:
                        type: boolean
                      service:
                        type: string
                      policy_id:
                        type: string
                  resource_allocation:
                    type: object
                    properties:
                      cpu_cores:
                        type: integer
                      ram_mb:
                        type: integer
                      gpu:
                        type: string
                      sgx_enabled:
                        type: boolean
                      tdx_enabled:
                        type: boolean
                      sev_snp_enabled:
                        type: boolean
                      sev_enabled:
                        type: boolean
                      nitro_enclave_enabled:
                        type: boolean
                  constraints:
                    $ref: '#/components/schemas/Constraints'
                  signature:
                    $ref: '#/components/schemas/Signature'
            infra_provider_count:
              type: integer
        session_info:
          type: object
          properties:
            id:
              type: string
            session_id:
              type: string
            requested_by:
              type: string
        contract_hash:
          type: string
        governance_signature:
          $ref: '#/components/schemas/Signature'
    SignResult:
      type: object
