            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/fl-output/<submissionId>/download' \
              --header 'Authorization: Bearer <token>' --output model.pt

  /api/v1/vm-registry:
    post:
      tags:
        - VM Registry
      summary: Register Participant VM
      description: |
        Registers (or updates) a participant VM's IP address. Called by the participant-VM provisioning right after
        it creates each VM.

        * `role` `user` is the output owner's VM; `data-provider` is a data provider's VM.
      operationId: post-vm-registry
      requestBody:
        description: |
          - `role` : `data-provider` or `user`
          - `participant_name` : The participant the VM belongs to
          - `ip_address` : The VM's IP address
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum:
                    - data-provider
                    - user
                participant_name:
                  type: string
                ip_address:
                  type: string
              required:
                - role
                - participant_name
                - ip_address
            examples:
              Register VM:
                value:
                  role: data-provider
                  participant_name: alice
                  ip_address: 10.0.4.17
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
        '400':
          description: |-
            Bad Request
            - `INVALID_ROLE` : `role` is not `data-provider` or `user`
            - `MISSING_FIELDS` : `participant_name` or `ip_address` missing
            - `INVALID_JSON` : the body is not valid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: INVALID_ROLE
                    message: role must be "data-provider" or "user"
        '401':
          $ref: '#/components/responses/VMRegistryUnauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - vmRegistryToken: []
      x-codeSamples:
        - lang: cURL
          label: Register VM
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/vm-registry' \
              --header 'X-VM-Registry-Token: <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/vm-registry/output-owner:
    get:
      tags:
        - VM Registry
      summary: Get Output Owner VM
      description: |
        Returns the most recently registered output-owner VM. A data provider's VM provisioning uses it to find the
        FL broker host.
      operationId: get-vm-registry-output-owner
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  vm:
                    $ref: '#/components/schemas/VMRegistryEntry'
              examples:
                Example:
                  value:
                    status: SUCCESS
                    vm:
                      role: user
                      participant_name: bob
                      ip_address: 10.0.4.10
                      updated_at: '2026-10-14T09:00:00Z'
        '401':
          $ref: '#/components/responses/VMRegistryUnauthorized'
        '404':
          description: |-
            Not Found
            - No output-owner VM registered yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: NOT_FOUND
                    message: no output-owner VM registered yet
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - vmRegistryToken: []
      x-codeSamples:
        - lang: cURL
          label: Get output owner VM
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/vm-registry/output-owner' \
