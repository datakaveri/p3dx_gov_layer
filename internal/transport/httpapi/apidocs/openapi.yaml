  /api/v1/job/{jobId}/contract/{contractId}:
    get:
      tags:
        - Job Approval
      summary: Get Job Contract
      description: |
        Returns a job's stored contract and its `contract_hash`. The stored hash is re-checked against a fresh hash
        of the stored contract, so a contract edited since is refused.

        Only the job's consumer or one of its data / infra providers may read it.
      operationId: get-job-contract
      parameters:
        - $ref: '#/components/parameters/JobIdParam'
        - $ref: '#/components/parameters/ContractIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  job_id:
                    type: string
                  contract_id:
                    type: string
                  contract_hash:
                    type: string
                  contract:
                    $ref: '#/components/schemas/Contract'
        '400':
          description: |-
            Bad Request
            - `BAD_REQUEST` : `jobId` missing
            - `NO_APPROVAL_NEEDED` : the contract does not go through job approval — it names no dataset, or no infrastructure while `REQUIRE_INFRA_APPROVAL` is on (with it off, TEE/SMPC contracts with datasets but no selected infrastructure are approved on their data-provider approval alone)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
        '401':
          $ref: '#/components/responses/DevTokenUnauthorized'
        '403':
          description: |-
            Forbidden
            - `NOT_JOB_PARTICIPANT` : only this job's consumer or its data / infra providers can read its contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: NOT_JOB_PARTICIPANT
