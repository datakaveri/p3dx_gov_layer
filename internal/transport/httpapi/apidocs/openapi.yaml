  /api/v1/me/fl/vm-credentials:
    post:
      tags:
        - FL Sessions
      summary: Issue FL Client-VM Credential
      description: |
        Issues the credential that a data provider's FL client VM uses to authenticate. The provider re-enters their
        password; the Governance Layer obtains an offline token for the `flotilla-vm` client, stores only its
        fingerprint, and hands the token to the FL orchestrator for delivery to the VM.

        Requires a fully signed, unexpired FL session contract on which the caller is a data-provider party. The VM
        then refreshes its access token with [Refresh FL Client-VM Token](#operation/post-fl-vm-token).
      operationId: post-fl-vm-credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submission_id, password]
              properties:
                submission_id:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: OK. `{status, credential_id, expires_at}`
        '400':
          description: Missing submission_id or password
        '401':
          description: Bad token, or `INVALID_CREDENTIALS` (wrong password)
        '403':
          description: '`INSUFFICIENT_ROLE` or `NOT_A_CONTRACT_PARTY`'
        '404':
          description: '`CONTRACT_NOT_FOUND`'
        '409':
          description: '`CONTRACT_NOT_SIGNED`, `NOT_AN_FL_CONTRACT` or `CONTRACT_NO_VALIDITY`'
        '410':
          description: '`CONTRACT_EXPIRED`'
        '502':
          description: '`KEYCLOAK_ERROR`, `NOT_OFFLINE_TOKEN` or `HANDOFF_FAILED`'
        '503':
          description: '`INTERNAL_KEY_NOT_CONFIGURED` or `CREDENTIAL_STORE_UNAVAILABLE`'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Issue FL Client-VM Credential
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/me/fl/vm-credentials' \
              --header 'Authorization: Bearer <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '<payload>'

  /api/v1/fl-output/{submissionId}:
    get:
      tags:
        - FL Outputs
      summary: Get FL Session Output
      description: |
        Returns a finished FL session's metrics and model details to its output owner (the contract's user party,
        matched against the token's `sub`). Once authorised, the response is always `200`: `status` is `ready` when
        both the metrics and the model are stored, otherwise `not_found`. Metric keys are normalised case-insensitively (first containing `acc` is
        accuracy, first containing `loss` is loss); accuracy is left as stored (usually a fraction).
      operationId: get-fl-output
      parameters:
        - $ref: '#/components/parameters/FLSubmissionParam'
      security:
        - authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Example:
                  value:
                    status: ready
                    session_id: sub-2026-10-14-001
                    rounds:
                      done: 2
                      total: 2
                    final:
                      accuracy: 0.91
                      loss: 0.27
                    per_round:
                      - round: 1
                        accuracy: 0.84
                        loss: 0.45
                      - round: 2
                        accuracy: 0.91
                        loss: 0.27
                    artifact:
                      file: model_sub-2026-10-14-001_round_2.pt
                      size_bytes: 4815162
                      modified_at: '2026-10-14T12:00:00Z'
                    fetched_at: '2026-10-14T12:00:01Z'
        '400':
          description: '`INVALID_SESSION_ID`'
        '401':
          description: Missing or invalid token
        '403':
          description: '`NOT_OUTPUT_OWNER`'
        '404':
          $ref: '#/components/responses/ContractNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: cURL
          label: Get FL output
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/fl-output/<submissionId>' \
              --header 'Authorization: Bearer <tokenValue>'

  /api/v1/fl-output/{submissionId}/download:
    get:
      tags:
        - FL Outputs
      summary: Download FL Session Model
      description: Downloads the session's final (highest-round) global model. Available to the output owner only.
      operationId: get-fl-output-download
      parameters:
        - $ref: '#/components/parameters/FLSubmissionParam'
      security:
        - authorization: []
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="model_<sid>_round_<round>.pt"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: '`INVALID_SESSION_ID`'
        '401':
          description: Missing or invalid token
        '403':
          description: '`NOT_OUTPUT_OWNER`'
        '404':
          description: '`CONTRACT_NOT_FOUND` or `NO_MODEL`'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: cURL
          label: Download FL model
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/fl-output/<submissionId>/download' \
              --header 'Authorization: Bearer <tokenValue>' --output model.pt

  /api/v1/final-model/summary:
    get:
      tags:
        - FL Outputs
      summary: Get Final Model Summary
      description: |
        A readable JSON view of a model checkpoint (layers, shapes, dtypes, total parameters, sample weights),
        so a model can be inspected without downloading it. `session_id` defaults to the newest session and
        `round` to its final (highest) round. Output owner only: the contract is looked
        up by the model's session id and its user party must match the token's `sub`.
      operationId: get-final-model-summary
      parameters:
        - $ref: '#/components/parameters/ModelSessionParam'
        - $ref: '#/components/parameters/ModelRoundParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  session_id:
                    type: string
                  round:
                    type: integer
                  file:
                    type: string
                  summary:
                    type: object
                    additionalProperties: true
                    description: The model inspector's output
        '400':
          $ref: '#/components/responses/ModelBadRequest'
        '401':
          description: Missing or invalid token
        '403':
          description: '`NOT_OUTPUT_OWNER` — only the session''s output owner may read it'
        '404':
          $ref: '#/components/responses/NoModel'
        '500':
          description: |-
            Internal Server Error
            - `PARSE_FAILED` : the checkpoint could not be inspected
            - `INTERNAL_ERROR`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Get final model summary
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/final-model/summary?session_id=<sessionId>&round=10' \
              --header 'Authorization: Bearer <tokenValue>'

  /api/v1/governance/ca-cert:
    get:
      tags:
        - FL Infrastructure
      summary: Governance CA Certificate
      description: Returns the Governance Layer CA certificate in PEM form. It is public so that FL clients can pin it and trust the session gateway certificates it signs.
      operationId: get-governance-ca-cert
      security: []
      responses:
        '200':
          description: OK
          content:
            application/x-pem-file:
              schema:
                type: string
        '503':
          description: CA_NOT_LOADED
      x-codeSamples:
        - lang: cURL
          label: Governance CA Certificate
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/governance/ca-cert'

  /p3dx/fl/vm-token:
    post:
      tags:
        - FL Infrastructure
      summary: Refresh FL Client-VM Token
      description: |
        Called by the FL client VM's sidecar, without a user token. Turns the VM's offline token (issued by
        `POST /api/v1/me/fl/vm-credentials`) into a short-lived access token, until the session contract's
        `lifecycle.valid_until`. If Keycloak rotates the offline token, the new one is returned in `offline_token`
        and only it is accepted from then on. Rate-limited per credential (30 a minute).
      operationId: post-fl-vm-token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_id, offline_token]
              properties:
                credential_id:
                  type: string
                offline_token:
                  type: string
      responses:
        '200':
          description: '`{status, access_token, expires_in, contract_valid_until}`, plus `offline_token` when it was rotated'
        '400':
          description: '`INVALID_REQUEST` : missing fields or malformed JSON'
        '401':
          description: '`UNKNOWN_CREDENTIAL`, `INVALID_CREDENTIAL`, `CREDENTIAL_EXPIRED`, `REFRESH_FAILED` or `SESSION_MISMATCH`'
        '429':
          description: '`RATE_LIMITED`'
        '503':
          description: '`CREDENTIAL_STORE_UNAVAILABLE`'
      x-codeSamples:
        - lang: cURL
          label: Refresh VM token
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/p3dx/fl/vm-token' \
              --header 'Content-Type: application/json' \
              --data-raw '{"credential_id": "<credentialId>", "offline_token": "<offlineToken>"}'

