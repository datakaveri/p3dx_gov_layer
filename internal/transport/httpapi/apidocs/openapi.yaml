  /api/v1/me/notifications/{id}/respond:
    post:
      tags:
        - My Account
      summary: Respond to My Notification
      description: |
        Answers an FL participation request on behalf of the caller.

        * `accepted` signs the provider's party on the session contract.
        * `declined` declines the request; a provider who declines twice is removed from the session.
        * A provider already removed from the session, or a request replaced by a newer one, receives `409`.
      operationId: post-my-notification-respond
