openapi: 3.0.2
info:
  title: DX Governance Layer Server
  version: 1.0.0
  description: |-

    # About DX Governance Layer

      **Governance Layer** (`p3dx_gov_layer`) is the trust and policy layer of the P3DX platform.
    It builds the contract behind every privacy-preserving computation (Federated Learning, TEE and SMPC),
    gets that contract approved and signed by every data and infra provider, checks it against the
    providers' policies in APD, and only then lets the computation run.

    It also keeps the participation notifications, projects, final FL models and participant-VM registry
    that the FL flow uses.

    # Configurations
    - **Server**:
      - In the doc, we display the server url to be https://v2.dev.iudx.io/gov-layer with the hostname as v2.dev.iudx.io/gov-layer
      - This could be configured according to the deployment
    - **Base path**:
      - Base path is the path on which API is served, relative to the host
      - Most APIs in this document contain `/api/v1` as their base path
      - Every `/api/v1` API is also served, unchanged, under the `/governance` base path (e.g. `/governance/contracts`)
      - The TEE run APIs (`/v1/tee/...`) and the FL client-VM APIs (`/p3dx/...`) are served at the server root, with no base path
    - **Request Samples**:
      - The `<tokenValue>` in the header of request sample could be replaced with respective token value [Also refer Tokens section [here](#section/Tokens)]
      - The `<payload>` in the request sample could be replaced with the payload given adjacent to the request sample

    # Roles
    Users hold DX realm roles in Keycloak. Roles are requested from, and approved in, dx-controlplane.

    | DX realm role | Who |
    |---------------|-----|
    | `consumer` | Data consumer: generates contracts and runs the job (the old P3DX `user`) |
    | `provider` | Data provider: registers datasets in APD and signs contracts (the old `data-provider`) |
    | `infra_provider` | Infra provider: registers infrastructure in APD and approves jobs on it |
    | `application_provider` | Application provider |
    | `cos_admin` | Platform admin (the old `admin`) |
    | `fl-orchestrator` | Service-account role of p3dx-fl-orchestrator |

    `data-provider` and `infra-provider` still appear as path segments (`/provider-keys/{role}`,
    `/job/approval/...`) and as party types inside contracts. They are identifiers, not realm roles.

    # Tokens
     - Endpoints that need a token take it as `Authorization: Bearer <tokenValue>`, except `POST /contract`, which takes it in the request body
     - Every user token is a Keycloak access token issued to the P3DX UI (password grant on the realm's token endpoint)
     - Endpoints not listed here need no token

    | Endpoint | Token Type | Users |
    |----------|------------|--------|
    | (GET, POST) /me/... | Keycloak Token | Any signed-in user; `GET /me/sign-requests` needs `provider` |
    | (GET, POST) /me/fl/... | Keycloak Token | FL output owner; `POST /me/fl/vm-credentials` needs `provider` |
    | [(GET) /workloads](#operation/list-workloads) | Keycloak Token | Any signed-in user |
    | [(PUT) /provider-keys/{role}](#operation/put-provider-key) | Keycloak Token | Data Provider, Infra Provider |
    | [(GET) /provider-keys/{role}/status](#operation/get-provider-key-status) | Keycloak Token | Data Provider, Infra Provider |
    | [(POST) /contract](#operation/post-contract) | Keycloak Token (in body) | Consumer |
    | [(POST) /generate-contract](#operation/post-generate-contract) | Keycloak Token | Consumer |
    | [(GET) /contracts/{contractId}/signatures](#operation/get-contract-signatures) | Keycloak Token | Any signed-in user |
    | [(POST) /contracts/{contractId}/sign](#operation/post-contract-sign) | Keycloak Token | Data Provider |
    | [(POST) /job/approval/data-provider](#operation/post-job-approval-data-provider) | Keycloak Token | Data Provider |
    | [(POST) /job/approval/infra-provider](#operation/post-job-approval-infra-provider) | Keycloak Token | Infra Provider |
    | [(GET) /job/{jobId}/status](#operation/get-job-status) | Keycloak Token | Consumer (the job's) |
    | [(POST) /job/{jobId}/tee](#operation/post-job-tee) | Keycloak Token | Consumer (the job's) |
    | [(GET) /job/{jobId}/contract/{contractId}](#operation/get-job-contract) | Keycloak Token | Consumer, Data Provider, Infra Provider (the job's) |
    | [(POST) /v1/tee/run](#operation/post-tee-run) | Keycloak Token | Consumer |
    | [(GET) /v1/tee/jobs/{jobId}](#operation/get-tee-job) | Keycloak Token | Consumer |
    | [(GET) /v1/tee/jobs/{jobId}/result](#operation/get-tee-job-result) | Keycloak Token | Consumer |
    | [(POST) /p3dx/fl/vm-token](#operation/post-fl-vm-token) | Offline token (in body) | FL client-VM sidecar |
    | [(GET) /projects](#operation/get-projects), [(GET) /projects/{sessionId}](#operation/get-project) | Keycloak service-account token (`fl-orchestrator` role) | p3dx-fl-orchestrator |
    | [(POST) /p3dx/internal/fl/vm-credentials/{id}/delivered](#operation/post-fl-vm-credential-delivered) | Keycloak service-account token (`fl-orchestrator` role) | p3dx-fl-orchestrator |
    | [(POST) /vm-registry](#operation/post-vm-registry) | `X-VM-Registry-Token` header | Provisioning scripts |
    | [(GET) /vm-registry/output-owner](#operation/get-vm-registry-output-owner) | `X-VM-Registry-Token` header | Provisioning scripts |
    | [(GET) /vm-registry/data-providers](#operation/get-vm-registry-data-providers) | `X-VM-Registry-Token` header | Provisioning scripts |

    The `X-VM-Registry-Token` header is only checked when the deployment sets `VM_REGISTRY_TOKEN`.

    # End-to-end flow: from dataset upload to running the job (TEE)
    The whole path, top-down, across every service. Steps 1–3 and 5 are other services; they are listed so the
    order is clear.

    **0. Sign in and get a role** (Keycloak, dx-controlplane)
    1. Sign in: `POST {keycloak}/realms/{realm}/protocol/openid-connect/token` (`grant_type=password`). Registration uses Keycloak's own page.
    2. Read the profile: `GET {controlplane}/iudx/v2/auth/user`
    3. New users get `consumer` by default. To become a provider, ask for `provider`, `infra_provider` or `application_provider`: `POST {controlplane}/iudx/v2/auth/roles/requests`, and check it with `GET .../roles/requests/my`
    4. A `cos_admin` approves it: `GET {controlplane}/iudx/v2/auth/admin/roles/requests`, then `PUT .../admin/roles/requests/{requestId}`. The role appears in the user's next token.

    **1. Data provider: set up a signing key** (this service)
    1. `GET /provider-keys/data-provider/status`. If no key is registered, the UI makes an RSA key pair in the browser and registers the public key: `PUT /provider-keys/data-provider`

    **2. Data provider: upload the dataset** (p3dx-apd)
    1. Pick the workloads the dataset allows: `GET /workloads` (this service)
    2. Register the dataset and its access policy: `POST {apd}/api/v1/me/policies` with `rules.policy_type = data-provider`, `dataset_id`, `data_url` (where the data lives) and `rules.key_resource_path` (the KBS key path). Needs the `provider` role.
    3. See or remove it: `GET {apd}/api/v1/me/policies/datasets`, `GET` / `DELETE {apd}/api/v1/me/policies/datasets/{itemId}`
    4. An infra provider registers infrastructure the same way (`rules.policy_type = infra-provider`, `infra_provider` role)

    **3. Consumer: choose what to run** (p3dx-apd, this service)
    1. Browse datasets: `GET {apd}/api/v1/catalogue/datasets`, and infrastructure: `GET {apd}/api/v1/catalogue/infrastructure`
    2. Pick the workload: `GET /workloads`

    **4. Consumer: generate the contract** (this service)
    1. `POST /generate-contract` with `datasets`, `technique` = `TEE`, `application_id` and `purpose`. The contract is stored and governance-signed, and each data provider gets a `CONTRACT_SIGN` request.
       A second request for the same datasets while one is still waiting returns `409 CONTRACT_PENDING`.
    2. Optionally edit the contract while it is unsigned: `PUT /contracts/{contractId}`

    **5. Data provider: consent and sign** (this service)
    1. See sign requests: `GET /me/sign-requests` (also pushed live on `GET /me/notifications/stream`)
    2. Sign the `contract_hash` with the private key from step 1: `POST /contracts/{contractId}/sign`
    3. Optionally: `POST /contracts/{contractId}/consent-expiry`, or `POST /contracts/{contractId}/withdraw-consent`

    **6. Consumer: wait until every provider has signed** (this service)
    1. Poll `GET /contracts/{contractId}/signatures` and `GET /contracts/{contractId}` until every party is valid

    **7. Consumer: run the job** (this service)
    1. `POST /v1/tee/run` with `contract_id`. The run gate checks that the stored contract still matches its hash, that the governance signature is valid, that every data provider has signed and that no consent has expired (`403 CONTRACT_NOT_SIGNED` otherwise). It then sends `CreateJob` to the Kata coordinator.
    2. Watch progress: `GET /v1/tee/jobs/{jobId}` (poll)
    3. Read the result: `GET /v1/tee/jobs/{jobId}/result`
    4. See the job and its history: `GET /me/jobs`

    If the contract also names infrastructure, steps 5–6 become the job flow below.

    # Job flow (TEE / SMPC with datasets and infra)
    1. Each provider registers their public key: `PUT /provider-keys/{role}`, and can check it is registered: `GET /provider-keys/{role}/status`
    2. The consumer generates the contract: `POST /generate-contract` (returns `job_id`, `contract_id` and `contract_hash`)
    3. Each data provider lists the jobs requested from them: `GET /me/jobs` (their `participation` entry has `status` = `requested`), and gets the contract and its `contract_hash`: `GET /job/{jobId}/contract/{contractId}`
    4. Each data provider and infra provider approves the job and signs the `contract_hash`: `POST /job/approval/data-provider`, `POST /job/approval/infra-provider`
    5. The consumer can check which providers have signed: `GET /contracts/{contractId}/signatures`
    6. The consumer cross-verifies the approvals and signatures, which makes the contract final: `GET /job/{jobId}/status`
    7. The consumer enables the TEE run: `POST /job/{jobId}/tee`

    The consumer can list the jobs they created and see each one's status at any point: `GET /me/jobs`.

    # API HTTP Responses
     Apart from the response codes specified in each API, the API server may respond with certain 4xx and 5xx error codes which are related to common API Gateway behaviours.
     The application should address them accordingly.

  contact:
    name: For support contact CDPG Team at
    email: support@datakaveri.org
    url: https://dataforpublicgood.org.in/
