      summary: Issue FL Client-VM Credential
      description: |
        A data provider re-enters their password; gov_layer gets a flotilla-vm OFFLINE token for
        them, stores only its fingerprint, and hands the token to p3dx-fl-orchestrator for the VM.
        Needs a fully signed, unexpired FL session contract with the caller as a data-provider party.
        The VM later refreshes with `POST /p3dx/fl/vm-token` and the orchestrator confirms delivery
        with `POST /p3dx/internal/fl/vm-credentials/{id}/delivered` (both at the server root).
      operationId: post-fl-vm-credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submission_id, password]
              properties:
                submission_id:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: '`{status, credential_id, expires_at}`'
        '400':
          description: Missing submission_id or password
        '401':
          description: Bad token, or `INVALID_CREDENTIALS` (wrong password)
        '403':
          description: '`INSUFFICIENT_ROLE` or `NOT_A_CONTRACT_PARTY`'
        '404':
          description: '`CONTRACT_NOT_FOUND`'
        '409':
          description: '`CONTRACT_NOT_SIGNED`, `NOT_AN_FL_CONTRACT` or `CONTRACT_NO_VALIDITY`'
        '410':
          description: '`CONTRACT_EXPIRED`'
        '502':
          description: '`KEYCLOAK_ERROR`, `NOT_OFFLINE_TOKEN` or `HANDOFF_FAILED`'
        '503':
          description: '`INTERNAL_KEY_NOT_CONFIGURED` or `CREDENTIAL_STORE_UNAVAILABLE`'
      security:
        - authorization: []

