  /v1/tee/run:
    post:
      tags:
        - TEE Run
      summary: Run TEE Job
      description: |
        The consumer's **Run TEE**. Served at the server root (not under `/api/v1`). Needs the `consumer` role.

        Run gate, checked on the stored contract before anything starts:
        * the stored contract still hashes to its `contract_hash` (a contract edited after signing never runs)
        * the governance signature is valid
        * every data provider has signed
        * no provider's consent has expired

        It then builds the CreateJob sub-contract from the contract and sends it to the Kata coordinator
        (`kata.coordinator.v1.CoordinatorService/CreateJob` on `COORDINATOR_ADDR`). The contract is marked
        TEE-enabled and the run's outcome is recorded in the contract history.
      operationId: post-tee-run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contract_id]
              properties:
                contract_id:
                  type: string
                  description: The contract returned by `POST /api/v1/generate-contract`
            example:
              contract_id: 5c2b1e7a-3d4f-4a6b-9e8c-7d6f5e4a3b2c
      responses:
        '200':
          description: |
            The run started. `job` is the coordinator's Job (its `jobId` is used with `GET /v1/tee/jobs/{jobId}`);
            `subContract` is what was sent. If the coordinator's reply is not JSON it is returned as `output`.
          content:
            application/json:
              example:
                status: SUCCESS
                job:
                  jobId: job-9f3c4952e83e
                subContract: {}
        '400':
          description: '`BAD_REQUEST` : `contract_id` is missing, or the body is not JSON'
        '401':
          $ref: '#/components/responses/ProviderTokenUnauthorized'
        '403':
          description: |-
            - `INSUFFICIENT_ROLE` : the caller is not a `consumer`
            - `CONTRACT_NOT_SIGNED` : the run gate failed; `message` says why (waiting on signatures, hash mismatch, no governance signature, draft contract)
            - `CONSENT_EXPIRED` : a provider's consent has expired
        '404':
          description: '`CONTRACT_NOT_FOUND`'
        '422':
          description: '`CONTRACT_INCOMPLETE` : the contract is missing fields the coordinator needs (named in `message`)'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: '`GRPCURL_FAILED` : the coordinator refused or could not be reached (`subContract` is included)'
        '503':
          description: '`NOT_CONFIGURED` : `COORDINATOR_ADDR` is not set'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Run TEE job
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/v1/tee/run' \
              --header 'Authorization: Bearer <tokenValue>' \
              --header 'Content-Type: application/json' \
              --data-raw '{"contract_id": "<contractId>"}'

  /v1/tee/jobs/{jobId}:
    get:
      tags:
        - TEE Run
      summary: Get TEE Job Progress
      description: |
        The coordinator's current view of a TEE job (`CoordinatorService/GetJob`). The UI polls it every few seconds.
        When the job is final its outcome is recorded on the contract. Needs the `consumer` role.
      operationId: get-tee-job
      parameters:
        - name: jobId
          in: path
          required: true
          description: The coordinator job id from `POST /v1/tee/run` (e.g. `job-9f3c4952e83e`)
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,128}$'
      responses:
        '200':
          description: '`{status: SUCCESS, job}`, `job` being the coordinator''s Job'
        '400':
          description: '`BAD_REQUEST` : invalid `jobId`'
        '401':
          $ref: '#/components/responses/ProviderTokenUnauthorized'
        '403':
          description: '`INSUFFICIENT_ROLE`'
        '502':
          description: '`GRPCURL_FAILED` or `BAD_COORDINATOR_RESPONSE`'
        '503':
          description: '`NOT_CONFIGURED` : `COORDINATOR_ADDR` is not set'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Get TEE job progress
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/v1/tee/jobs/<jobId>' \
              --header 'Authorization: Bearer <tokenValue>'

  /v1/tee/jobs/{jobId}/result:
    get:
      tags:
        - TEE Run
      summary: Get TEE Job Result
      description: |
        The result the workload wrote. gov_layer reads it from result storage itself (`RESULT_READ_URL`), so the
        read credential never reaches the browser. Needs the `consumer` role.
      operationId: get-tee-job-result
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,128}$'
      responses:
        '200':
          description: '`{status: SUCCESS, result}` for a JSON result, or `{status: SUCCESS, output}` (text) otherwise'
        '400':
          description: '`BAD_REQUEST` : invalid `jobId`'
        '401':
          $ref: '#/components/responses/ProviderTokenUnauthorized'
        '403':
          description: '`INSUFFICIENT_ROLE`'
        '502':
          description: '`RESULT_FETCH_FAILED` : result storage could not be read'
        '503':
          description: '`NOT_CONFIGURED` : `RESULT_READ_URL` is not set'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Get TEE job result
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/v1/tee/jobs/<jobId>/result' \
              --header 'Authorization: Bearer <tokenValue>'

  /p3dx/fl/vm-token:
    post:
      tags:
        - FL Client-VM Credentials
      summary: Refresh FL Client-VM Token
      description: |
        Called by the FL client VM's sidecar, with no user token. Turns the VM's offline token (issued by
        `POST /api/v1/me/fl/vm-credentials`) into a short-lived access token, until the session contract's
        `lifecycle.valid_until`. If Keycloak rotates the offline token, the new one is returned in `offline_token`
        and only it is accepted from then on. Rate-limited per credential (30 a minute).
      operationId: post-fl-vm-token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential_id, offline_token]
              properties:
                credential_id:
                  type: string
                offline_token:
                  type: string
      responses:
        '200':
          description: '`{status, access_token, expires_in, contract_valid_until}`, plus `offline_token` when it was rotated'
        '400':
          description: '`INVALID_REQUEST` : missing fields or malformed JSON'
        '401':
          description: '`UNKNOWN_CREDENTIAL`, `INVALID_CREDENTIAL`, `CREDENTIAL_EXPIRED`, `REFRESH_FAILED` or `SESSION_MISMATCH`'
        '429':
          description: '`RATE_LIMITED`'
        '503':
          description: '`CREDENTIAL_STORE_UNAVAILABLE`'
      x-codeSamples:
        - lang: cURL
          label: Refresh VM token
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/p3dx/fl/vm-token' \
              --header 'Content-Type: application/json' \
              --data-raw '{"credential_id": "<credentialId>", "offline_token": "<offlineToken>"}'

  /p3dx/internal/fl/vm-credentials/{id}/delivered:
    post:
      tags:
        - FL Client-VM Credentials
      summary: Confirm FL Client-VM Credential Delivery
      description: |
        p3dx-fl-orchestrator confirms it delivered a VM credential to the VM. Needs a Keycloak service-account
        token for the orchestrator client with the `fl-orchestrator` role.
      operationId: post-fl-vm-credential-delivered
      parameters:
        - name: id
          in: path
          required: true
          description: The `credential_id`
          schema:
            type: string
      responses:
        '200':
          description: '`{status, credential_id, state}`'
        '401':
          description: Missing or invalid service token
        '403':
          description: The token is not the orchestrator's, or lacks the `fl-orchestrator` role
        '404':
          description: '`UNKNOWN_CREDENTIAL`'
        '409':
          description: '`CREDENTIAL_EXPIRED`'
        '503':
          description: '`CREDENTIAL_STORE_UNAVAILABLE`'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Confirm credential delivery
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/p3dx/internal/fl/vm-credentials/<credentialId>/delivered' \
              --header 'Authorization: Bearer <tokenValue>'

components:
  securitySchemes:
    authorization:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak issued Bearer token
    vmRegistryToken:
      type: apiKey
      in: header
      name: X-VM-Registry-Token
      description: Shared secret; only checked when the deployment sets `VM_REGISTRY_TOKEN`
  parameters:
    FLSubmissionParam:
      name: submissionId
      in: path
      required: true
      description: The raw FL submission id (the contract's session_id)
      schema:
        type: string
    RoleParam:
      name: role
      in: path
      required: true
      description: The provider role the caller holds
      schema:
        type: string
        enum:
          - data-provider
          - infra-provider
    NotificationIdParam:
      name: key
      in: path
      required: true
      description: The notification's id
      schema:
        type: string
    SessionIdParam:
      name: sessionId
      in: path
      required: true
      description: The FL session (submission) id
      schema:
        type: string
    ContractIdParam:
      name: contractId
      in: path
      required: true
      description: The contract's id
      schema:
        type: string
    JobIdParam:
      name: jobId
      in: path
      required: true
      description: The job's id (from Generate Contract)
      schema:
        type: string
    ModelSessionParam:
      name: session_id
      in: query
      required: false
      description: The FL session; defaults to the newest session
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_-]+$
    ModelRoundParam:
      name: round
      in: query
      required: false
      description: The round; defaults to the session's final round
      schema:
        type: integer
        minimum: 0
  requestBodies:
    ApprovalBody:
      description: |
        - `job_id` : The job to approve
        - `contract_hash` : The hash from the job request
        - `signature` : The provider's base64 RSA signature (RSASSA-PKCS1-v1_5, SHA-256) over `contract_hash`
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              job_id:
                type: string
              contract_hash:
                type: string
              signature:
                type: string
            required:
              - job_id
              - contract_hash
              - signature
          examples:
            Approve Job:
              value:
                job_id: job-7d1e3c9a
                contract_hash: 9f2c4e6a8b0d1f3e5c7a9b1d3f5e7c9a1b3d5f7e9c1a3b5d7f9e1c3a5b7d9f1e
                signature: kX9v2Lq...Q==
  responses:
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: INTERNAL_ERROR
    InvalidJSON:
      description: |-
        Bad Request
        - `INVALID_JSON` : the body is not valid JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: INVALID_JSON
                message: Invalid JSON in request body
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: NOT_FOUND
    ContractNotFound:
      description: |-
        Not Found
        - No such contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: CONTRACT_NOT_FOUND
    JobNotFound:
      description: |-
        Not Found
        - No contract for this `job_id`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: NOT_FOUND
                message: No contract for this job_id
    ProviderTokenUnauthorized:
      description: |-
        Unauthorized
        - `MISSING_AUTH_TOKEN` : no Bearer token
        - `INVALID_OR_EXPIRED_TOKEN` : the token is invalid or expired
        - `INVALID_TOKEN_CLAIMS` : the token has no username or `sub`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: INVALID_OR_EXPIRED_TOKEN
    DevTokenUnauthorized:
      description: |-
        Unauthorized
        - `MISSING_AUTH_TOKEN` : no Bearer token
        - `INVALID_OR_EXPIRED_TOKEN` : the token is not a valid DX Keycloak token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: MISSING_AUTH_TOKEN
                message: send the consumer's dev Keycloak token as the Bearer token
    VMRegistryUnauthorized:
      description: |-
        Unauthorized
        - `UNAUTHORIZED` : `X-VM-Registry-Token` is missing or wrong
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: UNAUTHORIZED
                message: invalid or missing X-VM-Registry-Token
    ContractResult:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: SUCCESS
              contract:
                $ref: '#/components/schemas/Contract'
    SignatureStatus:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              signatures:
                type: string
                enum:
                  - matching
                  - not matching
              tee:
                type: string
                enum:
                  - can run
                  - cannot run
          examples:
            All signed:
              value:
                signatures: matching
                tee: can run
            Not all signed:
              value:
                signatures: not matching
                tee: cannot run
    ModelBadRequest:
      description: |-
        Bad Request
        - `INVALID_SESSION_ID` : `session_id` has characters other than letters, digits, `-` and `_`
        - `INVALID_ROUND` : `round` is not a non-negative integer
        - `INVALID_PATH`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: INVALID_ROUND
    NoModel:
      description: |-
        Not Found
        - `NO_MODEL` : no checkpoints yet, or none for that session / round
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failed'
          examples:
            Example:
              value:
                status: FAILED
                error: NO_MODEL
                message: No model for that session.
  schemas:
    Failed:
      type: object
      properties:
        status:
          type: string
          example: FAILED
        error:
          type: string
          description: Error code
        message:
          type: string
        detail:
          type: string
    DataProvider:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
    Notification:
      type: object
      properties:
        id:
          type: string
        recipient_id:
          type: string
        recipient_username:
          type: string
        sender_username:
          type: string
        message:
          type: string
        payload:
          type: object
          additionalProperties: true
        read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        response:
          type: string
          nullable: true
          enum:
            - accepted
            - declined
            - null
          description: '`null` until the recipient answers'
        response_message:
          type: string
          nullable: true
        responded_at:
          type: string
          format: date-time
          nullable: true
    CreatedNotification:
      type: object
      properties:
        id:
          type: string
        recipientId:
          type: string
        recipientUsername:
          type: string
        senderUsername:
          type: string
        message:
          type: string
        payload:
          type: object
          additionalProperties: true
        read:
          type: boolean
        created_at:
          type: string
    NotificationList:
      type: object
      properties:
        status:
          type: string
          example: SUCCESS
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
    NotificationResult:
      type: object
      properties:
        status:
          type: string
          example: SUCCESS
        notification:
          $ref: '#/components/schemas/Notification'
    Project:
      type: object
      properties:
        project_id:
          type: string
        session_id:
          type: string
        data_provider_usernames:
          type: array
          items:
            type: string
    Signature:
      type: object
      properties:
        signed_at:
          type: string
          format: date-time
          nullable: true
        signer:
          type: string
          description: Username whose public key verifies `value`
        algorithm:
          type: string
          example: RSASSA-PKCS1-v1_5-SHA256
        signed_hash:
          type: string
          description: The contract hash that was signed
        value:
          type: string
          description: base64 signature
    Constraints:
      type: object
      properties:
        accessibility_level:
          type: string
        restricted_to:
          type: array
          items:
            type: string
    Contract:
      type: object
      description: The contract shared by FL, TEE and SMPC.
      properties:
        project_id:
          type: string
        contract_id:
          type: string
        job_id:
          type: string
        version:
          type: integer
        lifecycle:
          type: object
          properties:
            created_at:
              type: string
              format: date-time
            valid_from:
              type: string
              format: date-time
            valid_until:
              type: string
              format: date-time
        technique:
          type: string
          enum:
            - FL
            - TEE
            - SMPC
        compute_choice:
          type: string
        parties:
          type: object
          properties:
            user:
              type: object
              description: The consumer
              properties:
                id:
                  type: string
                name:
                  type: string
                datablob_url:
                  type: string
                signature:
                  $ref: '#/components/schemas/Signature'
            data_providers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  dataset_id:
                    type: string
                  dataset_name:
                    type: string
                  dataset_version:
                    type: string
                  data_url:
                    type: string
                  constraints:
                    $ref: '#/components/schemas/Constraints'
                  trustee:
                    type: object
                    properties:
                      kbs_url:
                        type: string
                      key_resource_path:
                        type: string
                  signature:
                    $ref: '#/components/schemas/Signature'
            data_provider_count:
              type: integer
            application_providers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  app_name:
                    type: string
                  container_image:
                    type: string
                  container_digest:
                    type: string
                  constraints:
                    $ref: '#/components/schemas/Constraints'
                  signature:
                    $ref: '#/components/schemas/Signature'
            infra_providers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  region:
                    type: string
                  attestation:
                    type: object
                    properties:
                      required:
                        type: boolean
                      service:
                        type: string
                      policy_id:
                        type: string
                  resource_allocation:
                    type: object
                    properties:
                      cpu_cores:
                        type: integer
                      ram_mb:
                        type: integer
                      gpu:
                        type: string
                      sgx_enabled:
                        type: boolean
                      tdx_enabled:
                        type: boolean
                      sev_snp_enabled:
                        type: boolean
                      sev_enabled:
                        type: boolean
                      nitro_enclave_enabled:
                        type: boolean
                  constraints:
                    $ref: '#/components/schemas/Constraints'
                  signature:
                    $ref: '#/components/schemas/Signature'
            infra_provider_count:
              type: integer
        session_info:
          type: object
          properties:
            id:
              type: string
            session_id:
              type: string
            requested_by:
              type: string
        contract_hash:
          type: string
        governance_signature:
          $ref: '#/components/schemas/Signature'
    SignResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - signed
            - not signed
        message:
          type: string
    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        job_id:
          type: string
        type:
          type: string
          enum:
            - data-provider
            - infra-provider
        provider_id:
          type: string
        item:
          type: string
          description: The dataset or infra id
        status:
          type: string
          enum:
            - accepted
            - rejected
        has_role:
          type: boolean
        in_catalogue:
          type: boolean
        reason:
          type: string
        checked_at:
          type: string
          format: date-time
    ApprovalResult:
      type: object
      properties:
        status:
          type: string
          example: SUCCESS
        job_id:
          type: string
        type:
          type: string
          enum:
            - data-provider
            - infra-provider
        approval:
          type: string
          enum:
            - accepted
            - rejected
            - pending
          description: The caller's own result
        data_provider:
          type: string
          enum:
            - accepted
            - rejected
            - pending
        infra_provider:
          type: string
          enum:
            - accepted
            - rejected
            - pending
        job_approval:
          type: string
          description: The whole job's result
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        signature:
          type: object
          properties:
            submitted:
              type: boolean
            contract_hash:
              type: string
            items_signed:
              type: integer
            verified_at:
              type: string
            verified:
              type: boolean
              description: Data provider only; the signature was verified before recording
    GrantResult:
      type: object
      properties:
        item_type:
          type: string
          enum:
            - dataset
            - infra
        item_id:
          type: string
        policy_id:
          type: string
        status:
          type: string
          enum:
            - posted
            - failed
        error:
          type: string
    PartySignatureStatus:
      type: object
      properties:
        role:
          type: string
          enum:
            - data-provider
            - infra-provider
        provider_id:
          type: string
        dataset_name:
          type: string
        infra_id:
          type: string
        signed:
          type: boolean
        valid:
          type: boolean
        signer:
          type: string
        signed_at:
          type: string
          format: date-time
        error:
          type: string
    FinalContract:
      type: object
      nullable: true
      properties:
        job_id:
          type: string
        contract_id:
          type: string
        contract_hash:
          type: string
        contract:
          $ref: '#/components/schemas/Contract'
        created_at:
          type: string
          format: date-time
    UserJob:
      type: object
      properties:
        job_id:
          type: string
        contract_id:
          type: string
        technique:
          type: string
        job_state:
          type: string
          enum:
            - in_progress
            - final
            - tee_enabled
        created_at:
          type: string
          format: date-time
        finalized_at:
          type: string
          format: date-time
          nullable: true
        tee_enabled_at:
          type: string
          format: date-time
          nullable: true
        participation:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - consumer
                  - data-provider
                  - infra-provider
              participant_id:
                type: string
              user_id:
                type: string
              username:
                type: string
              item_id:
                type: string
              item_name:
                type: string
              status:
                type: string
                enum:
                  - created
                  - requested
                  - approved
                  - rejected
                  - signed
                  - final
                  - tee_enabled
              updated_at:
                type: string
                format: date-time
    VMRegistryEntry:
      type: object
      properties:
        role:
          type: string
          enum:
            - data-provider
            - user
        participant_name:
          type: string
        ip_address:
          type: string
        updated_at:
          type: string
