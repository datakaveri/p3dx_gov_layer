  /api/v1/job/{jobId}/status:
    get:
      tags:
        - Job Approval
      summary: Check Job Status
      description: |
        The job's consumer (the user who generated its contract) cross-verifies the job:

        1. every data and infra provider has approved it, and
        2. every provider's signature is over the Governance Layer's own hash of the contract and verifies with their
           registered public key.

        If both hold, the job is `approved` and only then is its **final contract** created
        (`final_contract_record`). The APD consumer grants for every dataset and infra are then posted.
        Otherwise `status` is `not approved` with the `reasons`, and nothing is created.

        Can be called again: once approved it re-verifies, returns the same final contract and re-posts the grants.
      operationId: get-job-status
      parameters:
        - $ref: '#/components/parameters/JobIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - approved
                      - not approved
                  reasons:
                    type: array
                    items:
                      type: string
                    description: Present when `not approved`
                  contract_hash:
                    type: string
                  signatures:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartySignatureStatus'
                  grants:
                    type: array
                    items:
                      $ref: '#/components/schemas/GrantResult'
                  final_contract:
                    type: boolean
                  final_contract_record:
                    $ref: '#/components/schemas/FinalContract'
                  final_contract_pending:
                    type: array
                    items:
                      type: string
              examples:
                Approved:
                  value:
                    status: approved
                    contract_hash: 9f2c4e6a8b0d1f3e5c7a9b1d3f5e7c9a1b3d5f7e9c1a3b5d7f9e1c3a5b7d9f1e
                    signatures:
                      - role: data-provider
                        provider_id: provider-alice
                        dataset_name: hospital-admissions-2025
                        signed: true
                        valid: true
                        signer: alice
                        signed_at: '2026-10-14T10:20:00Z'
                      - role: infra-provider
                        provider_id: provider-ivan
                        infra_id: infra-azure-cvm-01
                        signed: true
                        valid: true
                        signer: ivan
                        signed_at: '2026-10-14T10:25:00Z'
                    grants:
                      - item_type: dataset
                        item_id: b34eb955-c691-4fd3-b200-f18bc78810a2
                        policy_id: grant-job-7d1e3c9a-b34eb955
                        status: posted
                    final_contract: true
                    final_contract_record:
                      job_id: job-7d1e3c9a
                      contract_id: 5c2b1e7a-3d4f-4a6b-9e8c-7d6f5e4a3b2c
                      contract_hash: 9f2c4e6a8b0d1f3e5c7a9b1d3f5e7c9a1b3d5f7e9c1a3b5d7f9e1c3a5b7d9f1e
                      contract: {}
                      created_at: '2026-10-14T10:30:00Z'
                Not approved:
                  value:
                    status: not approved
                    reasons:
                      - no infra provider has approved yet
        '400':
          description: |-
            Bad Request
            - `BAD_REQUEST` : `jobId` missing
            - `NO_APPROVAL_NEEDED` : the contract does not go through job approval — it names no dataset, or no infrastructure while `REQUIRE_INFRA_APPROVAL` is on (with it off, TEE/SMPC contracts with datasets but no selected infrastructure are approved on their data-provider approval alone)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
        '401':
          $ref: '#/components/responses/DevTokenUnauthorized'
        '403':
          description: |-
            Forbidden
            - `NOT_JOB_CONSUMER` : only the user who generated this job's contract can check its status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: NOT_JOB_CONSUMER
                    message: only the user who generated this job's contract can check its status
        '404':
          $ref: '#/components/responses/JobNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Check job status
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/job/<jobId>/status' \
              --header 'Authorization: Bearer <tokenValue>'

  /api/v1/gateway-certs:
    post:
      tags:
        - Flotilla Gateway
      summary: Issue Gateway Certificate
      description: |
        The FL orchestrator's service account requests a TLS server certificate for an FL session's
        Flotilla gateway, signed by the governance CA. The contract (the session's latest, by
        `submission_id`, or that exact contract, by `project_id`) must be a final FL roster contract,
        fully signed and not expired; the certificate expires with the contract's `valid_until`.
        Every issued certificate is recorded before it is returned.
      operationId: post-gateway-cert
      security:
        - authorization: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - csr_pem
                - server_ip
              properties:
                csr_pem:
                  type: string
                server_ip:
                  type: string
                submission_id:
                  type: string
                  description: Exactly one of `submission_id` / `project_id`
                project_id:
                  type: string
                  description: Exactly one of `submission_id` / `project_id`
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  serial:
                    type: string
                  certificate_pem:
                    type: string
                  ca_certificate_pem:
                    type: string
                  fingerprint_sha256:
                    type: string
                  not_after:
                    type: string
                    format: date-time
                  contract_id:
                    type: string
                  project_id:
                    type: string
                  job_id:
                    type: string
                  submission_id:
                    type: string
                  valid_until:
                    type: string
                    format: date-time
                  parties:
                    type: array
                    items:
                      type: object
        '400':
          description: MISSING_FIELDS, INVALID_CSR or INVALID_IP
        '401':
          description: Missing or invalid service token
        '404':
          description: CONTRACT_NOT_FOUND
        '409':
          description: CONTRACT_NOT_SIGNED
        '410':
          description: CONTRACT_EXPIRED
  /api/v1/governance/ca-cert:
    get:
      tags:
        - Flotilla Gateway
      summary: Governance CA Certificate
      description: The governance CA certificate (PEM). Public, so FL clients can pin it to trust gateway certificates.
      operationId: get-governance-ca-cert
      security: []
      responses:
        '200':
          description: OK
          content:
            application/x-pem-file:
              schema:
                type: string
        '503':
          description: CA_NOT_LOADED
  /api/v1/job/{jobId}/tee:
    post:
      tags:
        - Jobs
      summary: Enable Job TEE Run
      description: |
        The job's consumer enables the TEE run for an approved job. Every signature on the final contract is re-verified.

        This starts nothing: the run itself is `POST /v1/tee/sessions` with `governanceContractId` set to the returned
        `contract_id` (see `next`).
      operationId: post-job-tee
      parameters:
        - $ref: '#/components/parameters/JobIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  job_id:
                    type: string
                  contract_id:
                    type: string
                  contract_hash:
                    type: string
                  tee:
                    type: string
                    example: enabled
                  tee_enabled_at:
                    type: string
                    format: date-time
                  next:
                    type: string
              examples:
                Example:
                  value:
                    status: SUCCESS
                    job_id: job-7d1e3c9a
                    contract_id: 5c2b1e7a-3d4f-4a6b-9e8c-7d6f5e4a3b2c
                    contract_hash: 9f2c4e6a8b0d1f3e5c7a9b1d3f5e7c9a1b3d5f7e9c1a3b5d7f9e1c3a5b7d9f1e
                    tee: enabled
                    tee_enabled_at: '2026-10-14T10:35:00Z'
                    next: POST /v1/tee/sessions with governanceContractId = 5c2b1e7a-3d4f-4a6b-9e8c-7d6f5e4a3b2c
        '400':
          description: |-
            Bad Request
            - `BAD_REQUEST` : `jobId` missing
            - `NO_APPROVAL_NEEDED` : the contract does not go through job approval — it names no dataset, or no infrastructure while `REQUIRE_INFRA_APPROVAL` is on (with it off, TEE/SMPC contracts with datasets but no selected infrastructure are approved on their data-provider approval alone)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
        '401':
          $ref: '#/components/responses/DevTokenUnauthorized'
        '403':
          description: |-
            Forbidden
            - `NOT_JOB_CONSUMER` : only the user who generated this job's contract can enable its TEE run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          description: |-
            Conflict
            - `CONTRACT_NOT_SIGNED` : not every signature on the contract verifies
            - `CONTRACT_NOT_FINAL` : the contract is not final yet; `GET /job/{jobId}/status` must return `approved` first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: CONTRACT_NOT_FINAL
                    message: 'the job''s contract is not final yet: every data and infra provider must approve it, then GET /job/job-7d1e3c9a/status must return approved'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Enable TEE run
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/job/<jobId>/tee' \
              --header 'Authorization: Bearer <tokenValue>'

  /api/v1/job/{jobId}/contract/{contractId}:
    get:
      tags:
        - Jobs
      summary: Get Job Contract
      description: |
        Returns a job's stored contract and its `contract_hash`. The stored hash is re-checked against a fresh hash
        of the stored contract, so a contract edited since is refused.

        Only the job's consumer or one of its data / infra providers may read it.
      operationId: get-job-contract
      parameters:
        - $ref: '#/components/parameters/JobIdParam'
        - $ref: '#/components/parameters/ContractIdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  job_id:
                    type: string
                  contract_id:
                    type: string
                  contract_hash:
                    type: string
                  contract:
                    $ref: '#/components/schemas/Contract'
        '400':
          description: |-
            Bad Request
            - `BAD_REQUEST` : `jobId` missing
            - `NO_APPROVAL_NEEDED` : the contract does not go through job approval — it names no dataset, or no infrastructure while `REQUIRE_INFRA_APPROVAL` is on (with it off, TEE/SMPC contracts with datasets but no selected infrastructure are approved on their data-provider approval alone)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
        '401':
          $ref: '#/components/responses/DevTokenUnauthorized'
        '403':
          description: |-
            Forbidden
            - `NOT_JOB_PARTICIPANT` : only this job's consumer or its data / infra providers can read its contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: NOT_JOB_PARTICIPANT
                    message: only this job's consumer or its data / infra providers can read its contract
        '404':
          description: |-
            Not Found
            - No contract for this job
            - `contractId` is not this job's contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
              examples:
                Example:
                  value:
                    status: FAILED
                    error: NOT_FOUND
                    message: contract_id c-123 is not this job's contract
        '409':
          description: |-
            Conflict
            - `CONTRACT_HASH_MISMATCH` : the stored contract no longer matches its stored `contract_hash`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Get job contract
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/job/<jobId>/contract/<contractId>' \
              --header 'Authorization: Bearer <tokenValue>'

  /api/v1/final-model/summary:
    get:
      tags:
        - Final Models
      summary: Get Final Model Summary
      description: |
        A readable JSON view of a model checkpoint (layers, shapes, dtypes, total parameters, sample weights),
        so a model can be inspected without downloading it. `session_id` defaults to the newest session and
        `round` to its final (highest) round. Output owner only: the contract is looked
        up by the model's session id and its user party must match the token's `sub`.
      operationId: get-final-model-summary
      parameters:
        - $ref: '#/components/parameters/ModelSessionParam'
        - $ref: '#/components/parameters/ModelRoundParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  session_id:
                    type: string
                  round:
                    type: integer
                  file:
                    type: string
                  summary:
                    type: object
                    additionalProperties: true
                    description: The model inspector's output
        '400':
          $ref: '#/components/responses/ModelBadRequest'
        '404':
          $ref: '#/components/responses/NoModel'
        '500':
          description: |-
            Internal Server Error
            - `PARSE_FAILED` : the checkpoint could not be inspected
            - `INTERNAL_ERROR`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
        '401':
          description: Missing or invalid token
        '403':
          description: '`NOT_OUTPUT_OWNER` — only the session''s output owner may read it'
      security:
        - authorization: []
      x-codeSamples:
        - lang: cURL
          label: Get final model summary
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/final-model/summary?session_id=<sessionId>&round=10' \
              --header 'Authorization: Bearer <token>'

  /api/v1/fl-output/{submissionId}:
    post:
      tags:
        - Final Models
      summary: Store FL Session Output
      description: |
        Called by the FL orchestrator's service account (client `ORCHESTRATOR_CLIENT_ID` with realm role
        `ORCHESTRATOR_ROLE`) once a session finishes. Streams the final global model to
        `model_<sid>_round_<round>.pt` and stores the metrics (plus `fetched_at`) as `output_<sid>.json` in
        `CHECKPOINT_DIR`. `<sid>` is `submissionId` with every character outside `[a-zA-Z0-9_-]` replaced by `_`.
        The whole upload is capped at `FL_OUTPUT_MAX_BYTES` (default 2 GiB).
      operationId: post-fl-output
      parameters:
        - $ref: '#/components/parameters/FLSubmissionParam'
      security:
        - authorization: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metrics
                - round
                - model
              properties:
                metrics:
                  type: string
                  description: |
                    JSON object: `global_validation_metrics` ({metric: [round1, round2, ...]}), `session_config`,
                    `start_timestamp`, `end_timestamp`, `last_checkpoint_round`, `rounds_total`
                round:
                  type: integer
                  minimum: 1
                model:
                  type: string
                  format: binary
                  description: The final model; send it as the last part
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: stored
                  session_id:
                    type: string
                  file:
                    type: string
                  size_bytes:
                    type: integer
              examples:
                Example:
                  value:
                    status: stored
                    session_id: sub-2026-10-14-001
                    file: model_sub-2026-10-14-001_round_10.pt
                    size_bytes: 4815162
        '400':
          description: |-
            Bad Request
            - `INVALID_SESSION_ID`, `INVALID_MULTIPART`, `INVALID_METRICS`, `INVALID_ROUND`, `MISSING_FIELDS`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Failed'
        '401':
          description: Missing or invalid service token
        '403':
          description: Token not issued to the orchestrator client, or lacks its role
        '413':
          description: Upload exceeds `FL_OUTPUT_MAX_BYTES` (`TOO_LARGE`)
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: cURL
          label: Store FL output
          source: |
            curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/fl-output/<submissionId>' \
              --header 'Authorization: Bearer <orchestratorToken>' \
              --form 'metrics=<metrics.json' --form 'round=10' --form 'model=@model.pt'
    get:
      tags:
        - Final Models
      summary: Get FL Session Output
      description: |
        The session's output for its output owner (the contract's user party; the dev Keycloak token's `sub`
        must match). Always 200 once authorised: `status` is `ready` only when both the metrics and the model
        are stored, else `not_found`. Metric keys are normalised case-insensitively (first containing `acc` is
        accuracy, first containing `loss` is loss); accuracy is left as stored (usually a fraction).
      operationId: get-fl-output
      parameters:
        - $ref: '#/components/parameters/FLSubmissionParam'
      security:
        - authorization: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                Example:
                  value:
                    status: ready
                    session_id: sub-2026-10-14-001
                    rounds:
                      done: 2
                      total: 2
                    final:
                      accuracy: 0.91
                      loss: 0.27
                    per_round:
                      - round: 1
                        accuracy: 0.84
                        loss: 0.45
                      - round: 2
                        accuracy: 0.91
                        loss: 0.27
                    artifact:
                      file: model_sub-2026-10-14-001_round_2.pt
                      size_bytes: 4815162
                      modified_at: '2026-10-14T12:00:00Z'
                    fetched_at: '2026-10-14T12:00:01Z'
        '400':
          description: '`INVALID_SESSION_ID`'
        '401':
          description: Missing or invalid token
        '403':
          description: '`NOT_OUTPUT_OWNER`'
        '404':
          $ref: '#/components/responses/ContractNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: cURL
          label: Get FL output
          source: |
            curl --location --request GET 'https://v2.dev.iudx.io/gov-layer/api/v1/fl-output/<submissionId>' \
              --header 'Authorization: Bearer <token>'

  /api/v1/fl-output/{submissionId}/download:
    get:
      tags:
        - Final Models
      summary: Download FL Session Model
      description: Downloads the session's highest-round model; output owner only.
      operationId: get-fl-output-download
      parameters:
        - $ref: '#/components/parameters/FLSubmissionParam'
