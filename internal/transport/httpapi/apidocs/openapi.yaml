#         application/json:
#           schema:
#             type: object
#             properties:
#               role:
#                 type: string
#                 enum:
#                   - data-provider
#                   - user
#               participant_name:
#                 type: string
#               ip_address:
#                 type: string
#             required:
#               - role
#               - participant_name
#               - ip_address
#           examples:
#             Register VM:
#               value:
#                 role: data-provider
#                 participant_name: alice
#                 ip_address: 10.0.4.17
#     responses:
#       '200':
#         description: OK
#         content:
#           application/json:
#             schema:
#               type: object
#               properties:
#                 status:
