# /api/v1/gateway-certs:
#   post:
#     tags:
#       - Flotilla Gateway
#     summary: Issue Gateway Certificate
#     description: |
#       The FL orchestrator's service account requests a TLS server certificate for an FL session's
#       Flotilla gateway, signed by the governance CA. The contract (the session's latest, by
#       `submission_id`, or that exact contract, by `project_id`) must be a final FL roster contract,
#       fully signed and not expired; the certificate expires with the contract's `valid_until`.
#       Every issued certificate is recorded before it is returned.
#     operationId: post-gateway-cert
#     security:
#       - authorization: []
#     requestBody:
#       required: true
#       content:
#         application/json:
#           schema:
#             type: object
#             required:
#               - csr_pem
#               - server_ip
#             properties:
#               csr_pem:
#                 type: string
#               server_ip:
#                 type: string
#               submission_id:
#                 type: string
#                 description: Exactly one of `submission_id` / `project_id`
#               project_id:
#                 type: string
#                 description: Exactly one of `submission_id` / `project_id`
#     responses:
#       '200':
#         description: OK
#         content:
#           application/json:
#             schema:
#               type: object
#               properties:
#                 status:
#                   type: string
#                 serial:
#                   type: string
#                 certificate_pem:
#                   type: string
#                 ca_certificate_pem:
#                   type: string
#                 fingerprint_sha256:
#                   type: string
#                 not_after:
#                   type: string
#                   format: date-time
#                 contract_id:
#                   type: string
#                 project_id:
#                   type: string
#                 job_id:
#                   type: string
#                 submission_id:
#                   type: string
#                 valid_until:
#                   type: string
#                   format: date-time
#                 parties:
#                   type: array
#                   items:
#                     type: object
#       '400':
#         description: MISSING_FIELDS, INVALID_CSR or INVALID_IP
#       '401':
#         description: Missing or invalid service token
#       '404':
#         description: CONTRACT_NOT_FOUND
#       '409':
#         description: CONTRACT_NOT_SIGNED
#       '410':
#         description: CONTRACT_EXPIRED
#
# /api/v1/fl-output/{submissionId}:
#   post:
#     tags:
#       - Final Models
#     summary: Store FL Session Output
#     description: |
#       Called by the FL orchestrator's service account (client `ORCHESTRATOR_CLIENT_ID` with realm role
#       `ORCHESTRATOR_ROLE`) once a session finishes. Streams the final global model to
#       `model_<sid>_round_<round>.pt` and stores the metrics (plus `fetched_at`) as `output_<sid>.json` in
#       `CHECKPOINT_DIR`. `<sid>` is `submissionId` with every character outside `[a-zA-Z0-9_-]` replaced by `_`.
#       The whole upload is capped at `FL_OUTPUT_MAX_BYTES` (default 2 GiB).
#     operationId: post-fl-output
#     parameters:
#       - $ref: '#/components/parameters/FLSubmissionParam'
#     security:
#       - authorization: []
#     requestBody:
#       required: true
#       content:
#         multipart/form-data:
#           schema:
#             type: object
#             required:
#               - metrics
#               - round
#               - model
#             properties:
#               metrics:
#                 type: string
#                 description: |
#                   JSON object: `global_validation_metrics` ({metric: [round1, round2, ...]}), `session_config`,
#                   `start_timestamp`, `end_timestamp`, `last_checkpoint_round`, `rounds_total`
#               round:
#                 type: integer
#                 minimum: 1
#               model:
#                 type: string
#                 format: binary
#                 description: The final model; send it as the last part
#     responses:
#       '201':
#         description: Created
#         content:
#           application/json:
#             schema:
#               type: object
#               properties:
#                 status:
#                   type: string
#                   example: stored
#                 session_id:
#                   type: string
#                 file:
#                   type: string
#                 size_bytes:
#                   type: integer
#             examples:
#               Example:
#                 value:
#                   status: stored
#                   session_id: sub-2026-10-14-001
#                   file: model_sub-2026-10-14-001_round_10.pt
#                   size_bytes: 4815162
#       '400':
#         description: |-
#           Bad Request
#           - `INVALID_SESSION_ID`, `INVALID_MULTIPART`, `INVALID_METRICS`, `INVALID_ROUND`, `MISSING_FIELDS`
#         content:
#           application/json:
#             schema:
#               $ref: '#/components/schemas/Failed'
#       '401':
#         description: Missing or invalid service token
#       '403':
#         description: Token not issued to the orchestrator client, or lacks its role
#       '413':
#         description: Upload exceeds `FL_OUTPUT_MAX_BYTES` (`TOO_LARGE`)
#       '500':
#         $ref: '#/components/responses/InternalError'
#     x-codeSamples:
#       - lang: cURL
#         label: Store FL output
#         source: |
#           curl --location --request POST 'https://v2.dev.iudx.io/gov-layer/api/v1/fl-output/<submissionId>' \
#             --header 'Authorization: Bearer <tokenValue>' \
#             --form 'metrics=<metrics.json' --form 'round=10' --form 'model=@model.pt'
#
