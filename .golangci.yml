# golangci-lint v2 config (Jenkinsfile GOLANGCI_IMAGE golangci/golangci-lint:v2.14.0, Go 1.26).
# Same checks as the previous v1 config: the "standard" set (errcheck, govet, ineffassign, staticcheck, unused;
# v2 folds gosimple into staticcheck) plus a few high-value ones; gofmt is a formatter in v2.
version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: standard
  enable:
    - bodyclose       # unclosed HTTP response bodies
    - errorlint       # wrong error comparisons/wrapping
    - misspell
formatters:
  enable:
    - gofmt
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
